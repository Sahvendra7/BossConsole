# Supabase Edge Functions - Deno-based serverless functions
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-functions-config
  labels:
    app: supabase
    component: functions
data:
  # Sample function for testing
  hello-world.ts: |
    const handler = async (req: Request): Promise<Response> => {
      const headers = {
        "Content-Type": "application/json",
        "Access-Control-Allow-Origin": "*",
        "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type"
      };
      
      if (req.method === "OPTIONS") {
        return new Response(null, { status: 200, headers });
      }
      
      try {
        let name = "World";
        if (req.method === "POST") {
          const body = await req.text();
          if (body) {
            const json = JSON.parse(body);
            name = json.name || "World";
          }
        }
        
        const data = {
          message: `Hello ${name} from Supabase Edge Functions!`,
          timestamp: new Date().toISOString(),
          method: req.method,
        };
        
        return new Response(JSON.stringify(data), { headers });
      } catch (error) {
        return new Response(
          JSON.stringify({ error: "Function error", details: error.message }),
          { status: 500, headers }
        );
      }
    };
    
    console.log("Starting Supabase Edge Function on port 9000...");
    Deno.serve({ port: 9000 }, handler);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-functions
  labels:
    app: supabase
    component: functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase
      component: functions
  template:
    metadata:
      labels:
        app: supabase
        component: functions
    spec:
      containers:
      - name: edge-runtime
        image: denoland/deno:1.40.2
        ports:
        - containerPort: 9000
          name: http
        command: ["deno"]
        args: ["run", "--allow-net", "--allow-env", "/home/deno/functions/hello-world.ts"]
        env:
        # Core configuration
        - name: SUPABASE_URL
          value: "http://34.9.47.213"
        - name: SUPABASE_ANON_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQ1NzY0MjcyLCJleHAiOjE5NjExNDAyNzJ9.mfBxOvZpOLQfhEuwMOmtKRN3PYhm3H5-b8lSzUfSLEQ"
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE2NDU3NjQyNzIsImV4cCI6MTk2MTE0MDI3Mn0.V7fmSY9T8jJwYgRKE1lnG3wy6ygcgvP3HJ8M-2QLkJ4"
        - name: JWT_SECRET
          value: "super-secret-jwt-token-with-at-least-32-characters-long"
        # Database connection for functions
        - name: DB_URL
          value: "postgresql://supabase_admin:SuperSecurePassword123@35.225.71.65:5432/postgres"
        # Edge Runtime configuration
        - name: FUNCTIONS_VERIFY_JWT
          value: "false"
        volumeMounts:
        - name: functions-code
          mountPath: /home/deno/functions/hello-world.ts
          subPath: hello-world.ts
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: functions-code
        configMap:
          name: supabase-functions-config

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-functions
  labels:
    app: supabase
    component: functions
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9000
    targetPort: 9000
  selector:
    app: supabase
    component: functions

---
# External access for Edge Functions
apiVersion: v1
kind: Service
metadata:
  name: supabase-functions-lb
  labels:
    app: supabase
    component: functions
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 9000
  selector:
    app: supabase
    component: functions