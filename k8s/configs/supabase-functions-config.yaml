apiVersion: v1
data:
  hello-world.ts: "const handler = async (req: Request): Promise<Response> => {\n
    \ const url = new URL(req.url);\n  const pathname = url.pathname;\n  \n  const
    headers = {\n    \"Content-Type\": \"application/json\",\n    \"Access-Control-Allow-Origin\":
    \"*\",\n    \"Access-Control-Allow-Headers\": \"authorization, x-client-info,
    apikey, content-type\"\n  };\n  \n  if (req.method === \"OPTIONS\") {\n    return
    new Response(null, { status: 200, headers });\n  }\n  \n  console.log(`Request:
    ${req.method} ${pathname}`);\n  \n  // Studio Management API endpoints - check
    these first\n  if (pathname.includes(\"/_admin/functions\")) {\n    console.log(\"Admin
    API request detected\");\n    \n    if (pathname === \"/_admin/functions\" ||
    pathname === \"/functions/v1/_admin/functions\") {\n      const functions = [{\n
    \       id: \"hello-world\",\n        slug: \"hello-world\",\n        name: \"hello-world\",
    \n        status: \"ACTIVE\",\n        version: 1,\n        created_at: \"2025-08-09T11:00:00Z\",\n
    \       updated_at: \"2025-08-09T11:00:00Z\",\n        import_map: null,\n        entrypoint:
    \"index.ts\",\n        verify_jwt: false\n      }];\n      return new Response(JSON.stringify(functions),
    { headers });\n    }\n    \n    if (pathname.includes(\"/_admin/functions/hello-world\"))
    {\n      const functionInfo = {\n        id: \"hello-world\",\n        slug: \"hello-world\",
    \n        name: \"hello-world\",\n        status: \"ACTIVE\",\n        version:
    1,\n        created_at: \"2025-08-09T11:00:00Z\",\n        updated_at: \"2025-08-09T11:00:00Z\"\n
    \     };\n      return new Response(JSON.stringify(functionInfo), { headers });\n
    \   }\n    \n    return new Response(JSON.stringify({ error: \"Admin endpoint
    not found\" }), { \n      status: 404, headers \n    });\n  }\n  \n  // Regular
    function execution\n  try {\n    let name = \"World\";\n    \n    if (req.method
    === \"POST\") {\n      const body = await req.text();\n      if (body) {\n        const
    json = JSON.parse(body);\n        name = json.name || \"World\";\n      }\n    }\n
    \   \n    const data = {\n      message: `Hello ${name} from Supabase Edge Functions!`,\n
    \     timestamp: new Date().toISOString(),\n      method: req.method,\n    };\n
    \   \n    return new Response(JSON.stringify(data), { headers });\n  } catch (error)
    {\n    return new Response(\n      JSON.stringify({ error: \"Function error\",
    details: error.message }),\n      { status: 500, headers }\n    );\n  }\n};\n\nconsole.log(\"Starting
    Enhanced Supabase Edge Functions on port 9000...\");\nconsole.log(\"Management
    API: /_admin/functions\");\nDeno.serve({ port: 9000 }, handler);\n"
