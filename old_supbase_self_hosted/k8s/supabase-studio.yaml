# Supabase Studio - Self-hosted dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-studio
  labels:
    app: supabase-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase-studio
  template:
    metadata:
      labels:
        app: supabase-studio
    spec:
      containers:
      - name: studio
        image: supabase/studio:latest
        ports:
        - containerPort: 3000
        env:
        # Use Kong as the main API gateway
        - name: SUPABASE_URL
          value: "http://34.9.47.213"
        # Individual service URLs (Studio needs direct access)
        - name: SUPABASE_REST_URL
          value: "http://34.66.84.207"
        - name: SUPABASE_AUTH_URL
          value: "http://34.9.246.150"
        - name: SUPABASE_STORAGE_URL
          value: "http://34.67.139.68"
        - name: SUPABASE_REALTIME_URL
          value: "ws://34.42.189.31"
        - name: SUPABASE_META_URL
          value: "http://34.58.246.78"
        - name: SUPABASE_FUNCTIONS_URL
          value: "http://34.68.96.199"
        # JWT Keys
        - name: SUPABASE_ANON_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQ1NzY0MjcyLCJleHAiOjE5NjExNDAyNzJ9.mfBxOvZpOLQfhEuwMOmtKRN3PYhm3H5-b8lSzUfSLEQ"
        - name: SUPABASE_SERVICE_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE2NDU3NjQyNzIsImV4cCI6MTk2MTE0MDI3Mn0.V7fmSY9T8jJwYgRKE1lnG3wy6ygcgvP3HJ8M-2QLkJ4"
        # Database connection
        - name: POSTGRES_HOST
          value: "35.225.71.65"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_USER
          value: "supabase_admin"
        - name: POSTGRES_PASSWORD
          value: "SuperSecurePassword123"
        # Studio specific config
        - name: STUDIO_PG_META_URL
          value: "http://34.58.246.78"
        - name: PUBLIC_URL
          value: "http://34.9.47.213"

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-studio
  labels:
    app: supabase-studio
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: supabase-studio