# Kong API Gateway for Supabase Studio
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  labels:
    app: supabase
    component: kong
data:
  kong.yml: |
    _format_version: "2.1"

    services:
      - name: auth-service
        url: http://supabase-auth:9999
        routes:
          # Original path-based routing
          - name: auth-route
            paths:
              - /auth/v1
          # Domain-based routing for api.risaboss.com
          - name: auth-domain-route
            paths:
              - /auth/v1
            hosts:
              - api.risaboss.com
              - auth.risaboss.com
          # Direct auth domain routing
          - name: auth-subdomain-route
            paths:
              - /
            hosts:
              - auth.risaboss.com
            strip_path: false

      - name: rest-service
        url: http://supabase-rest:3000
        routes:
          # Original path-based routing
          - name: rest-route
            paths:
              - /rest/v1
          # Domain-based routing for api.risaboss.com
          - name: rest-domain-route
            paths:
              - /rest/v1
            hosts:
              - api.risaboss.com

      - name: functions-service
        url: http://supabase-functions:8000
        routes:
          # Original path-based routing
          - name: functions-route
            paths:
              - /functions/v1
          - name: functions-admin-route
            paths:
              - /_admin/functions
            strip_path: false
          # Domain-based routing for api.risaboss.com
          - name: functions-domain-route
            paths:
              - /functions/v1
            hosts:
              - api.risaboss.com
          - name: functions-admin-domain-route
            paths:
              - /_admin/functions
            hosts:
              - api.risaboss.com
            strip_path: false

      - name: storage-service
        url: http://supabase-storage:5000
        routes:
          # Storage routing for both API and subdomain
          - name: storage-route
            paths:
              - /storage/v1
            hosts:
              - api.risaboss.com
              - storage.risaboss.com
          # Direct storage domain routing
          - name: storage-subdomain-route
            paths:
              - /
            hosts:
              - storage.risaboss.com
            strip_path: false

      - name: realtime-service
        url: http://supabase-realtime:4000
        routes:
          # Realtime routing for both API and subdomain
          - name: realtime-route
            paths:
              - /realtime/v1
            hosts:
              - api.risaboss.com
              - realtime.risaboss.com
          # Direct realtime domain routing
          - name: realtime-subdomain-route
            paths:
              - /
            hosts:
              - realtime.risaboss.com
            strip_path: false

      - name: meta-service
        url: http://supabase-pg-meta:8080
        routes:
          # Original path-based routing
          - name: meta-route
            paths:
              - /pg
          # Domain-based routing for api.risaboss.com
          - name: meta-domain-route
            paths:
              - /pg
            hosts:
              - api.risaboss.com

      - name: studio-service
        url: http://supabase-studio:3000
        routes:
          # Studio routing for studio.risaboss.com
          - name: studio-route
            paths:
              - /
            hosts:
              - studio.risaboss.com
            strip_path: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-kong
  labels:
    app: supabase
    component: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase
      component: kong
  template:
    metadata:
      labels:
        app: supabase
        component: kong
    spec:
      containers:
      - name: kong
        image: kong:3.4.2
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: "/usr/local/kong/kong.yml"
        - name: KONG_DNS_ORDER
          value: "LAST,A,CNAME"
        - name: KONG_PLUGINS
          value: "request-size-limiting,cors,key-auth,acl,basic-auth"
        - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
          value: "160k"
        - name: KONG_NGINX_PROXY_PROXY_BUFFERS
          value: "64 160k"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_LOG_LEVEL
          value: "info"
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        volumeMounts:
        - name: kong-config
          mountPath: /usr/local/kong/kong.yml
          subPath: kong.yml
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: kong-config
        configMap:
          name: kong-config

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong
  labels:
    app: supabase
    component: kong
spec:
  type: ClusterIP
  ports:
  - name: proxy
    port: 8000
    targetPort: 8000
  - name: admin
    port: 8001
    targetPort: 8001
  selector:
    app: supabase
    component: kong

---
# External access for Kong
apiVersion: v1
kind: Service
metadata:
  name: supabase-kong-lb
  labels:
    app: supabase
    component: kong
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  ports:
  - name: proxy
    port: 80
    targetPort: 8000
  selector:
    app: supabase
    component: kong