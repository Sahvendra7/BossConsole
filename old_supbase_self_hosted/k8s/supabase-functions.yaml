# Supabase Edge Functions - Deno-based serverless functions
# ConfigMap is managed by deploy-all-functions.sh script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-functions
  labels:
    app: supabase
    component: functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supabase
      component: functions
  template:
    metadata:
      labels:
        app: supabase
        component: functions
    spec:
      containers:
      - name: edge-runtime
        image: denoland/deno:1.40.2
        ports:
        - containerPort: 8000
          name: http
        command: ["deno"]
        args: ["run", "--allow-net", "--allow-env", "/home/deno/functions/passkey-functions.ts"]
        env:
        # Core configuration
        - name: SUPABASE_URL
          value: "http://34.9.47.213"
        - name: SUPABASE_ANON_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQ1NzY0MjcyLCJleHAiOjE5NjExNDAyNzJ9.mfBxOvZpOLQfhEuwMOmtKRN3PYhm3H5-b8lSzUfSLEQ"
        - name: SUPABASE_SERVICE_ROLE_KEY
          value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3NTU2NzgwNDcsImV4cCI6MTc4NzIxNDA0N30.pKLau2EB3LGspHIzqU9FfBJg7uOxKHKxXNoTSh6F72I"
        - name: JWT_SECRET
          value: "super-secret-jwt-token-with-at-least-32-characters-long"
        # Database connection for functions
        - name: DB_URL
          value: "postgresql://supabase_admin:SuperSecurePassword123@35.225.71.65:5432/postgres"
        # Edge Runtime configuration
        - name: FUNCTIONS_VERIFY_JWT
          value: "false"
        volumeMounts:
        - name: functions-code
          mountPath: /home/deno/functions/passkey-functions.ts
          subPath: passkey-functions.ts
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: functions-code
        configMap:
          name: supabase-functions-config

---
apiVersion: v1
kind: Service
metadata:
  name: supabase-functions
  labels:
    app: supabase
    component: functions
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  selector:
    app: supabase
    component: functions

---
# External access for Edge Functions
apiVersion: v1
kind: Service
metadata:
  name: supabase-functions-lb
  labels:
    app: supabase
    component: functions
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8000
  selector:
    app: supabase
    component: functions