apiVersion: v1
data:
  kong.yml: |
    _format_version: "2.1"

    consumers:
      - username: admin
        basicauth_credentials:
          - username: admin
            password: StudioAdmin2025!

    services:
      - name: auth-service
        url: http://supabase-auth:9999
        routes:
          # Original path-based routing
          - name: auth-route
            paths:
              - /auth/v1
          # Domain-based routing for api.risaboss.com
          - name: auth-domain-route
            paths:
              - /auth/v1
            hosts:
              - api.risaboss.com
              - auth.risaboss.com
          # Direct auth domain routing
          - name: auth-subdomain-route
            paths:
              - /
            hosts:
              - auth.risaboss.com
            strip_path: false
          # Email verification endpoint  
          - name: verify-route
            paths:
              - /verify
            hosts:
              - api.risaboss.com
            strip_path: false
            plugins:
              - name: request-termination
                config:
                  status_code: 302
                  message: |
                    <html>
                    <head><title>BOSS Password Reset</title></head>
                    <body>
                      <h2>Opening BOSS app for password reset...</h2>
                      <p>If BOSS doesn't open automatically, please open the BOSS app manually.</p>
                      <script>
                        // Extract URL fragment parameters
                        const hash = window.location.hash.substring(1);
                        const params = new URLSearchParams(hash);
                        const accessToken = params.get('access_token');
                        const type = params.get('type');
                        
                        if (type === 'recovery' && accessToken) {
                          // Redirect to BOSS app for password reset
                          const deepLink = 'boss://auth/verify#access_token=' + accessToken + '&type=recovery';
                          window.location.href = deepLink;
                        } else {
                          // For other verification types, redirect to auth service
                          window.location.href = '/auth/v1/verify' + window.location.search + window.location.hash;
                        }
                      </script>
                    </body>
                    </html>
                  headers:
                    'Content-Type': 'text/html'

      - name: rest-service
        url: http://supabase-rest:3000
        routes:
          # Original path-based routing
          - name: rest-route
            paths:
              - /rest/v1
          # Domain-based routing for api.risaboss.com
          - name: rest-domain-route
            paths:
              - /rest/v1
            hosts:
              - api.risaboss.com

      - name: functions-service
        url: http://supabase-functions:8000
        routes:
          # Original path-based routing
          - name: functions-route
            paths:
              - /functions/v1
          - name: functions-admin-route
            paths:
              - /_admin/functions
            strip_path: false
          # Domain-based routing for api.risaboss.com
          - name: functions-domain-route
            paths:
              - /functions/v1
            hosts:
              - api.risaboss.com
          - name: functions-admin-domain-route
            paths:
              - /_admin/functions
            hosts:
              - api.risaboss.com
            strip_path: false

      - name: storage-service
        url: http://supabase-storage:5000
        routes:
          # Storage routing for both API and subdomain
          - name: storage-route
            paths:
              - /storage/v1
            hosts:
              - api.risaboss.com
              - storage.risaboss.com
          # Direct storage domain routing
          - name: storage-subdomain-route
            paths:
              - /
            hosts:
              - storage.risaboss.com
            strip_path: false

      - name: realtime-service
        url: http://supabase-realtime:4000
        routes:
          # Realtime routing for both API and subdomain
          - name: realtime-route
            paths:
              - /realtime/v1
            hosts:
              - api.risaboss.com
              - realtime.risaboss.com
          # Direct realtime domain routing
          - name: realtime-subdomain-route
            paths:
              - /
            hosts:
              - realtime.risaboss.com
            strip_path: false

      - name: meta-service
        url: http://supabase-pg-meta:8080
        routes:
          # Original path-based routing
          - name: meta-route
            paths:
              - /pg
          # Domain-based routing for api.risaboss.com
          - name: meta-domain-route
            paths:
              - /pg
            hosts:
              - api.risaboss.com

      - name: studio-service
        url: http://supabase-studio:3000
        plugins:
          - name: basic-auth
            config:
              hide_credentials: true
        routes:
          # Studio routing for studio.risaboss.com with basic auth
          - name: studio-route
            paths:
              - /
            hosts:
              - studio.risaboss.com
            strip_path: false
