# Database
db:
  enabled: true
  image:
    repository: supabase/postgres
    tag: "15.6.1.137"
  persistence:
    enabled: true
    size: 10Gi

# Studio
studio:
  enabled: true
  image:
    repository: supabase/studio
    tag: "latest"

# Auth
auth:
  enabled: true
  image:
    repository: supabase/gotrue
    tag: "v2.177.0"
  environment:
    GOTRUE_SITE_URL: "boss://auth/verify"
    GOTRUE_URI_ALLOW_LIST: "boss://auth/verify,https://app.risaboss.com/auth/callback"
    GOTRUE_DISABLE_SIGNUP: "false"
    GOTRUE_JWT_EXPIRY: "3600"
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    GOTRUE_MAILER_AUTOCONFIRM: "false"
    GOTRUE_SMTP_HOST: "smtp.sendgrid.net"
    GOTRUE_SMTP_PORT: "587"
    GOTRUE_SMTP_USER: "apikey"
    GOTRUE_SMTP_ADMIN_EMAIL: "noreply.boss@risalabs.ai"

# Rest
rest:
  enabled: true
  image:
    repository: supabase/postgrest
    tag: "latest"

# Realtime
realtime:
  enabled: true
  image:
    repository: supabase/realtime
    tag: "v2.34.47"
  environment:
    APP_NAME: "realtime"

# Meta
meta:
  enabled: true
  image:
    repository: supabase/postgres-meta
    tag: "latest"

# Storage
storage:
  enabled: true
  image:
    repository: supabase/storage-api
    tag: "latest"
  persistence:
    enabled: true
    size: 10Gi

# Image Proxy
imgproxy:
  enabled: false

# Kong
kong:
  enabled: true
  image:
    repository: kong
    tag: "2.8"
  ingress:
    enabled: true
    className: "gce"
    annotations:
      kubernetes.io/ingress.class: "gce"
      ingress.gcp.kubernetes.io/managed-certificates: "supabase-ssl-cert"
    hosts:
      - host: api.risaboss.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  service:
    type: ClusterIP

# Analytics
analytics:
  enabled: false

# Vector
vector:
  enabled: false

# Functions
functions:
  enabled: true
  image:
    repository: risashivang/edge-runtime
    tag: "configurable-path"
  environment:
    SUPABASE_FUNCTIONS_PATH: "/home/deno/functions"
  # Optional: specify which function to use as the main service
  # If not specified, defaults to the first function found
  # mainFunction: hello-world

# Minio
minio:
  enabled: false

