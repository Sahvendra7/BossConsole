apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: supabase-kong-backendconfig
  namespace: supabase
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /functions/v1/main
    port: 8000