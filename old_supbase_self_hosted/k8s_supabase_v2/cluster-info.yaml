# GKE Cluster Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: supabase
data:
  cluster_name: "supabase"
  project_id: "boss-455616"
  zone: "us-central1-a"
  node_count: "3"
  machine_type: "e2-standard-4"
  network_type: "private"
  master_cidr: "172.17.0.0/28"
  created_date: "2025-09-09"
  
---
# Cluster Access Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-info
  namespace: supabase
data:
  # Commands to access cluster
  get_credentials: |
    gcloud container clusters get-credentials supabase \
      --zone us-central1-a \
      --project boss-455616
  
  # Update master authorized networks (replace YOUR_IP)
  update_authorized_networks: |
    MY_IP=$(curl -s ifconfig.me)
    gcloud container clusters update supabase \
      --zone us-central1-a \
      --enable-master-authorized-networks \
      --master-authorized-networks=$MY_IP/32 \
      --project boss-455616