name: Windows Build and Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI
        run: |
          echo "Building Windows MSI..."
          ./gradlew packageMsi
          echo "Windows MSI build completed successfully"

      - name: Find MSI File
        id: find-msi
        run: |
          $msiFiles = Get-ChildItem "composeApp/build/compose/binaries/main/msi/BOSS-*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            $msiPath = $msiFiles[0].FullName
            Write-Host "Found MSI: $msiPath"
            echo "msi-path=$msiPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "MSI file not found!"
            exit 1
          }
        shell: powershell

      - name: Check if signing secret is available
        id: check-secret
        run: |
          if [ -n "$CERT_HOST" ]; then
            echo "can_sign=true" >> $GITHUB_OUTPUT
          else
            echo "can_sign=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
        env:
          CERT_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}

      - name: Debug secrets and paths
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          Write-Host "[DEBUG] Checking environment and paths..." -ForegroundColor Cyan
          Write-Host "MSI Path from find-msi step: ${{ steps.find-msi.outputs.msi-path }}"
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          
          # Check if MSI file exists
          $msiPath = "${{ steps.find-msi.outputs.msi-path }}"
          if (Test-Path $msiPath) {
            Write-Host "[OK] MSI file exists at: $msiPath" -ForegroundColor Green
          } else {
            Write-Host "[ERROR] MSI file not found at: $msiPath" -ForegroundColor Red
          }
          
          # Check credential environment variables (without exposing values)
          Write-Host "[DEBUG] Environment variables set:"
          if ($env:CERTIFICATE_HOST) { Write-Host "✓ CERTIFICATE_HOST is set" } else { Write-Host "✗ CERTIFICATE_HOST is missing" }
          if ($env:CERTIFICATE_HOST_API_KEY) { Write-Host "✓ CERTIFICATE_HOST_API_KEY is set" } else { Write-Host "✗ CERTIFICATE_HOST_API_KEY is missing" }
          if ($env:CERTIFICATE_SHA1_HASH) { Write-Host "✓ CERTIFICATE_SHA1_HASH is set" } else { Write-Host "✗ CERTIFICATE_SHA1_HASH is missing" }
          if ($env:CLIENT_CERTIFICATE) { Write-Host "✓ CLIENT_CERTIFICATE is set" } else { Write-Host "✗ CLIENT_CERTIFICATE is missing" }
          if ($env:CLIENT_CERTIFICATE_PASSWORD) { Write-Host "✓ CLIENT_CERTIFICATE_PASSWORD is set" } else { Write-Host "✗ CLIENT_CERTIFICATE_PASSWORD is missing" }
          if ($env:KEYPAIR_ALIAS) { Write-Host "✓ KEYPAIR_ALIAS is set" } else { Write-Host "✗ KEYPAIR_ALIAS is missing" }
        shell: powershell
        env:
          CERTIFICATE_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}
          CERTIFICATE_HOST_API_KEY: ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }}
          CERTIFICATE_SHA1_HASH: ${{ secrets.CODE_SIGNING_CERT_SHA1_HASH }}
          CLIENT_CERTIFICATE: ${{ secrets.CODE_SIGNING_CLIENT_CERT }}
          CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          KEYPAIR_ALIAS: ${{ secrets.CODE_SIGNING_KEYPAIR_ALIAS }}

      - name: Decode Client Certificate
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          try {
            $certContent = "${{ secrets.CODE_SIGNING_CLIENT_CERT }}"
            $certBytes = [System.Convert]::FromBase64String($certContent)
            $certPath = "${{ runner.temp }}\Certificate_pkcs12.p12"
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
            Write-Host "Client cert decoded successfully to $certPath"
          } catch {
            Write-Host "Error decoding client cert: $_"
            exit 1
          }
        shell: powershell

      - name: Verify Client Cert File Exists
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          $certPath = "${{ runner.temp }}\Certificate_pkcs12.p12"
          if (Test-Path $certPath) {
            Write-Host "[OK] Cert file exists at $certPath"
            Write-Host "File size: $((Get-Item $certPath).Length) bytes"
          } else {
            Write-Host "[ERROR] Cert file MISSING at $certPath"
            exit 1
          }
        shell: powershell

      - name: Install DigiCert STM Client Tools
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        uses: digicert/ssm-code-signing@v1.1.0
        env:
          SM_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}
          SM_API_KEY: ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          SM_TRACE: true

      - name: Reset SMCTL Credentials
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          smctl credentials delete
          smctl credentials save ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }} ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
        shell: cmd
        env:
          SM_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}
          SM_API_KEY: ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          SM_TRACE: true

      - name: Run SMCTL Healthcheck
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          smctl healthcheck
        shell: cmd
        env:
          SM_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}
          SM_API_KEY: ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          SM_TRACE: true

      - name: Sign Windows MSI with DigiCert KeyLocker
        if: ${{ steps.check-secret.outputs.can_sign == 'true' }}
        run: |
          echo "Signing MSI: ${{ steps.find-msi.outputs.msi-path }}"
          echo "Using keypair: ${{ secrets.CODE_SIGNING_KEYPAIR_ALIAS }}"
          smctl sign --keypair-alias "${{ secrets.CODE_SIGNING_KEYPAIR_ALIAS }}" --input "${{ steps.find-msi.outputs.msi-path }}" --verbose
        shell: bash
        env:
          SM_HOST: ${{ secrets.CODE_SIGNING_CERT_HOST }}
          SM_API_KEY: ${{ secrets.CODE_SIGNING_CERT_HOST_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}\Certificate_pkcs12.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}
          SM_TRACE: true

      - name: Check SMKSP Log (for diagnostics)
        if: always()  # Runs even if signing fails
        run: |
          $logPath = "$env:USERPROFILE\.signingmanager\logs\smksp.log"
          if (Test-Path $logPath) {
            Write-Host "SMKSP Log Contents:"
            Get-Content $logPath -Tail 50  # Last 50 lines for recent errors
          } else {
            Write-Host "SMKSP log not found."
          }
        shell: powershell

      - name: Verify Build Artifacts
        run: |
          $msiPath = "$env:GITHUB_WORKSPACE\composeApp\build\compose\binaries\main\msi\BOSS-*.msi"
          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "MSI found: $($msiFiles[0].FullName)"
            Write-Host "Size: $([math]::Round($msiFiles[0].Length/1MB,2)) MB"
          } else {
            Write-Host "MSI not found at expected location"
            exit 1
          }
        shell: powershell

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: boss-windows-msi
          path: composeApp/build/compose/binaries/main/msi/
          retention-days: 30