name: Windows Build and Sign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI
        run: |
          echo "Building Windows MSI..."
          ./gradlew packageMsi
          echo "Windows MSI build completed successfully"

      - name: Find MSI File
        id: find-msi
        run: |
          $msiFiles = Get-ChildItem "composeApp/build/compose/binaries/main/msi/BOSS-*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            $msiPath = $msiFiles[0].FullName
            Write-Host "Found MSI: $msiPath"
            echo "msi-path=$msiPath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "MSI file not found!"
            exit 1
          }
        shell: powershell

      - name: Sign Windows MSI with DigiCert
        if: ${{ secrets.CODE_SIGNING_CLIENT_CERT != '' }}
        run: |
          Write-Host "[SIGN] Signing Windows MSI with DigiCert certificate..." -ForegroundColor Green
          
          # Get MSI file path
          $msiFile = "${{ steps.find-msi.outputs.msi-path }}"
          Write-Host "[INFO] MSI to sign: $msiFile" -ForegroundColor Yellow
          
          # Setup DigiCert client certificate
          Write-Host "[KEY] Setting up DigiCert client certificate..." -ForegroundColor Yellow
          $certBase64 = "${{ secrets.CODE_SIGNING_CLIENT_CERT }}"
          [System.Convert]::FromBase64String($certBase64) | Set-Content "Certificate_pkcs12.p12" -Encoding Byte
          
          # Find SignTool
          $signtoolPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe",
            "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools\x64\signtool.exe"
          )
          
          $signtoolPath = $null
          foreach ($path in $signtoolPaths) {
            if (Test-Path $path) {
              $signtoolPath = $path
              break
            }
          }
          
          if (-not $signtoolPath) {
            Write-Host "[ERROR] SignTool not found!" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "[TOOL] Using SignTool: $signtoolPath" -ForegroundColor Cyan
          
          # Sign with P12 file
          Write-Host "[SIGN] Signing MSI with P12 certificate..." -ForegroundColor Yellow
          $signOutput = & $signtoolPath sign /f "Certificate_pkcs12.p12" /p "${{ secrets.CODE_SIGNING_CLIENT_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v "$msiFile" 2>&1
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[SUCCESS] MSI signed successfully!" -ForegroundColor Green
            
            # Verify signature
            $verifyOutput = & $signtoolPath verify /pa /v "$msiFile" 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[OK] Signature verification successful!" -ForegroundColor Green
            } else {
              Write-Host "[WARN] Signature verification failed, but file was signed" -ForegroundColor Yellow
            }
          } else {
            Write-Host "[ERROR] MSI signing failed!" -ForegroundColor Red
            Write-Host $signOutput
            exit 1
          }
          
          # Cleanup
          Remove-Item "Certificate_pkcs12.p12" -ErrorAction SilentlyContinue
        shell: powershell

      - name: Verify Build Artifacts
        run: |
          $msiPath = "composeApp/build/compose/binaries/main/msi/BOSS-*.msi"
          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "MSI found: $($msiFiles[0].FullName)"
            Write-Host "Size: $([math]::Round($msiFiles[0].Length/1MB,2)) MB"
          } else {
            Write-Host "MSI not found at expected location"
            exit 1
          }
        shell: powershell

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: boss-windows-msi
          path: composeApp/build/compose/binaries/main/msi/
          retention-days: 30