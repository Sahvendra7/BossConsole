name: JxBrowser Auto-Release

run-name: JxBrowser auto-release${{ inputs.target_version && format(' — {0}', inputs.target_version) || '' }}

on:
  schedule:
    # TeamDev releases roughly monthly. Four-hour polling keeps pickup prompt
    # without spending hundreds of no-op runner minutes each month.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Force a specific JxBrowser version (testing/backfill)'
        required: false
      dry_run:
        description: 'Resolve and validate the release without dispatching a build'
        type: boolean
        default: false

concurrency:
  group: jxbrowser-autorelease
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve latest JxBrowser release
        id: release
        env:
          RELEASES_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: bash .github/scripts/check-jxbrowser-release.sh

      - name: Report auto-release blocker
        if: steps.release.outputs.reason == 'artifact_not_ready' || steps.release.outputs.reason == 'release_repeatedly_failing'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.latest_version }}
          REASON: ${{ steps.release.outputs.reason }}
          BLOCKED_ARTIFACT: ${{ steps.release.outputs.blocked_artifact }}
        run: |
          set -euo pipefail
          if [[ "$REASON" == "artifact_not_ready" ]]; then
            issue_title="JxBrowser $VERSION release artifacts are not ready"
            issue_body="TeamDev metadata advertises JxBrowser $VERSION, but the required artifact \`$BLOCKED_ARTIFACT\` is not resolvable. Automatic dispatch is paused until every required platform artifact is available."
          else
            issue_title="JxBrowser $VERSION auto-release is repeatedly failing"
            issue_body="The two most recent automated Chromium branding runs for JxBrowser $VERSION failed. Automatic retries are paused to avoid repeatedly running the full platform matrix.

          Inspect the failed runs, fix the underlying problem, then manually run \`build-chromium-branding.yml\` for version \`$VERSION\`."
          fi
          issues="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$issue_title in:title" \
            --json number,title)"
          issue_number="$(jq -r --arg title "$issue_title" \
            'first(.[] | select(.title == $title) | .number) // empty' <<< "$issues")"
          if [[ -n "$issue_number" ]]; then
            echo "Issue #$issue_number already tracks this failure."
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$issue_title" \
            --body "$issue_body"

      - name: Close recovered blocker issues
        if: steps.release.outputs.latest_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.latest_version }}
          REASON: ${{ steps.release.outputs.reason }}
        run: |
          set -euo pipefail
          close_recovered_issue() {
            local active_reason="$1"
            local issue_title="$2"
            local issues issue_numbers issue_number
            [[ "$REASON" == "$active_reason" ]] && return 0
            if [[ "$active_reason" == "release_repeatedly_failing" && "$REASON" != "release_already_published" ]]; then
              return 0
            fi
            issues="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$issue_title in:title" \
              --json number,title)"
            issue_numbers="$(jq -r --arg title "$issue_title" \
              '.[] | select(.title == $title) | .number' <<< "$issues")"
            while IFS= read -r issue_number || [[ -n "$issue_number" ]]; do
              if [[ -n "$issue_number" ]]; then
                gh issue close "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment "The watcher recovered with status \`$REASON\`; closing this blocker automatically."
              fi
            done <<< "$issue_numbers"
          }

          close_recovered_issue \
            artifact_not_ready \
            "JxBrowser $VERSION release artifacts are not ready"
          close_recovered_issue \
            release_repeatedly_failing \
            "JxBrowser $VERSION auto-release is repeatedly failing"

      - name: Dispatch Chromium branding
        if: steps.release.outputs.should_dispatch == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          GH_TOKEN: ${{ github.token }}
          JXBROWSER_VERSION: ${{ steps.release.outputs.latest_version }}
        run: |
          gh workflow run build-chromium-branding.yml \
            --ref main \
            -f jxbrowser_version="$JXBROWSER_VERSION"

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.latest_version }}
          SHOULD_DISPATCH: ${{ steps.release.outputs.should_dispatch }}
          REASON: ${{ steps.release.outputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## JxBrowser auto-release"
            echo
            echo "- Candidate: \`${VERSION:-unresolved}\`"
            echo "- Dispatch required: \`${SHOULD_DISPATCH:-unknown}\`"
            echo "- Reason: \`${REASON:-check_failed}\`"
            echo "- Dry run: \`${DRY_RUN:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"
