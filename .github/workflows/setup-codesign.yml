name: 🔐 Setup Code Signing

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform to setup signing for'
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

jobs:
  setup-signing:
    runs-on: ${{ inputs.platform }}
    steps:
      - name: 🍎 Setup macOS Code Signing
        if: inputs.platform == 'macos-latest' && secrets.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          echo "🔐 Setting up macOS code signing..."
          
          # Create temporary files
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Decode certificate
          echo "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" | base64 --decode > $CERT_PATH
          
          # Create keychain
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          
          # Import certificate
          security import $CERT_PATH \
            -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH
          
          # Set keychain to be used for codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # Verify certificate
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          
          echo "✅ macOS code signing setup complete"

      - name: 🪟 Setup Windows Code Signing
        if: inputs.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: powershell
        run: |
          Write-Host "🔐 Setting up Windows code signing..."
          
          # Create certificate file
          $CertPath = "$env:RUNNER_TEMP\certificate.p12"
          $CertBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          [System.IO.File]::WriteAllBytes($CertPath, $CertBytes)
          
          # Import certificate to Windows Certificate Store
          $SecurePassword = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          Import-PfxCertificate -FilePath $CertPath -CertStoreLocation Cert:\CurrentUser\My -Password $SecurePassword
          
          # Verify certificate
          Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object {$_.Subject -like "*Fnu Shivang*"}
          
          Write-Host "✅ Windows code signing setup complete"

      - name: ℹ️  No Code Signing
        if: (inputs.platform == 'macos-latest' && secrets.MACOS_CERTIFICATE_BASE64 == '') || (inputs.platform == 'windows-latest' && secrets.WINDOWS_CERTIFICATE_BASE64 == '')
        run: |
          echo "ℹ️ Code signing certificates not provided for ${{ inputs.platform }}"
          echo "Builds will be created without code signing"
          echo "For production releases, add signing certificates to repository secrets"