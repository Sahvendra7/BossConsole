name: 🔐 Test MSI Signing with DigiCert

on:
  workflow_dispatch:

jobs:
  test-msi-signing:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Create Test MSI
        run: |
          Write-Host "Creating test MSI file for signing..."
          
          # Create a simple test MSI using WiX (if available) or just create a dummy file
          # For testing purposes, we'll create a simple executable and then test signing process
          $testContent = @"
using System;
namespace TestApp {
    class Program {
        static void Main() {
            Console.WriteLine("DigiCert MSI Signing Test");
        }
    }
}
"@
          
          $testContent | Out-File -FilePath "TestApp.cs" -Encoding UTF8
          Add-Type -TypeDefinition $testContent -OutputAssembly "test-app.exe"
          
          if (Test-Path "test-app.exe") {
            Write-Host "✅ Test executable created for signing test"
            $fileInfo = Get-Item "test-app.exe"
            Write-Host "File size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "❌ Failed to create test file"
            exit 1
          }
        shell: powershell

      - name: 🔐 Test DigiCert Signing Process
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=== Testing DigiCert Signing with Updated Certificate ID ==="
          
          # Check secrets
          $apiKey = "${{ secrets.DIGICERT_API_KEY }}"
          $clientKey = "${{ secrets.DIGICERT_CLIENT_AUTH_KEY }}"
          $certId = "${{ secrets.DIGICERT_CERTIFICATE_ID }}"
          $certBase64 = "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}"
          
          Write-Host "Certificate ID being used: $certId"
          
          if (-not ($apiKey -and $clientKey -and $certId -and $certBase64)) {
            Write-Host "❌ Missing required secrets"
            exit 1
          }
          
          # Download and install DigiCert tools
          Write-Host ""
          Write-Host "=== Installing DigiCert Tools ==="
          try {
            gh release download keylocker-tools --pattern "Keylockertools-windows-x64.msi" --clobber
            
            if (Test-Path "Keylockertools-windows-x64.msi") {
              Write-Host "✅ Downloaded DigiCert tools"
              
              # Install
              $installProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "Keylockertools-windows-x64.msi", "/quiet", "/norestart" -Wait -PassThru
              
              # Find smctl
              $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
              if (-not (Test-Path $smctlPath)) {
                $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "smctl.exe" -ErrorAction SilentlyContinue
                if ($found) { $smctlPath = $found[0].FullName }
              }
              
              if (Test-Path $smctlPath) {
                Write-Host "✅ DigiCert tools ready"
              } else {
                Write-Host "❌ DigiCert tools installation failed"
                exit 1
              }
            }
          } catch {
            Write-Host "❌ Error installing DigiCert tools: $($_.Exception.Message)"
            exit 1
          }
          
          # Set up environment
          Write-Host ""
          Write-Host "=== Setting Up Signing Environment ==="
          $env:SM_HOST = "https://clientauth.one.digicert.com"
          $env:SM_API_KEY = $apiKey
          $env:SM_CLIENT_CERT_FILE = "Certificate_pkcs12.p12"
          $env:SM_CLIENT_CERT_PASSWORD = $clientKey
          
          # Create certificate file
          [System.Convert]::FromBase64String($certBase64) | Set-Content "Certificate_pkcs12.p12" -Encoding Byte
          Write-Host "✅ Environment configured"
          
          # Test signing the executable
          Write-Host ""
          Write-Host "=== Testing File Signing ==="
          $testFile = "test-app.exe"
          
          Write-Host "Signing file: $testFile"
          Write-Host "Using certificate ID: $certId"
          Write-Host "Command: smctl.exe sign --keypair-alias=$certId --input=$testFile"
          
          try {
            & $smctlPath sign --keypair-alias=$certId --input=$testFile
            $signCode = $LASTEXITCODE
            Write-Host "Signing exit code: $signCode"
            
            if ($signCode -eq 0) {
              Write-Host "✅ SIGNING SUCCESSFUL!"
              
              # Verify signature
              Write-Host ""
              Write-Host "=== Verifying Signature ==="
              $signtoolPaths = @(
                "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
                "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
              )
              
              foreach ($signtoolPath in $signtoolPaths) {
                if (Test-Path $signtoolPath) {
                  Write-Host "Using signtool: $signtoolPath"
                  & $signtoolPath verify /pa $testFile
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "✅ SIGNATURE VERIFICATION SUCCESSFUL!"
                    Write-Host ""
                    Write-Host "🎉 DIGICERT SIGNING IS NOW WORKING!"
                    Write-Host "The certificate ID fix was successful."
                  } else {
                    Write-Host "⚠️ Signature verification failed, but signing completed"
                  }
                  break
                }
              }
              
            } else {
              Write-Host "❌ SIGNING FAILED with exit code: $signCode"
              Write-Host "This indicates the certificate ID might still be wrong or there's another issue"
            }
            
          } catch {
            Write-Host "❌ Signing exception: $($_.Exception.Message)"
          }
          
          # Cleanup
          Remove-Item "Certificate_pkcs12.p12" -ErrorAction SilentlyContinue
          Write-Host ""
          Write-Host "=== Test completed ==="
        shell: powershell