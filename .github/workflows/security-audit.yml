name: 🛡️ Security Audit

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.gradle*'
      - 'gradle/**'
      - '.github/workflows/**'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔍 Generate Dependency Tree
        run: |
          echo "🔍 Generating dependency tree..."
          ./gradlew dependencies --configuration compileClasspath > dependencies-report.txt
          ./gradlew dependencies --configuration runtimeClasspath >> dependencies-report.txt

      - name: 🛡️ Run OWASP Dependency Check
        run: |
          echo "🛡️ Running OWASP dependency check..."
          # Add OWASP dependency check plugin if not present
          # This would require adding to build.gradle.kts:
          # id("org.owasp.dependencycheck") version "8.4.0"
          
          echo "ℹ️ To enable OWASP scanning, add to build.gradle.kts:"
          echo 'plugins {'
          echo '    id("org.owasp.dependencycheck") version "8.4.0"'
          echo '}'
          
          # For now, just check for common vulnerable dependencies
          echo "🔍 Checking for known vulnerable dependencies..."
          
          VULNERABLE_DEPS=""
          if grep -q "log4j.*1\." dependencies-report.txt; then
            VULNERABLE_DEPS="$VULNERABLE_DEPS\n- Log4j 1.x (CVE-2019-17571)"
          fi
          
          if grep -q "jackson.*2\.9\." dependencies-report.txt; then
            VULNERABLE_DEPS="$VULNERABLE_DEPS\n- Jackson 2.9.x (multiple CVEs)"
          fi
          
          if [ -n "$VULNERABLE_DEPS" ]; then
            echo "⚠️ Potentially vulnerable dependencies found:"
            echo -e "$VULNERABLE_DEPS"
          else
            echo "✅ No known vulnerable dependencies detected"
          fi

      - name: 📊 Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependencies-report.txt
          retention-days: 30

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: 🔍 Scan for API Keys and Secrets
        run: |
          echo "🔍 Scanning for potential secrets..."
          
          # Common secret patterns
          PATTERNS=(
            "api[_-]?key"
            "secret[_-]?key"
            "password"
            "token"
            "credential"
            "auth"
          )
          
          FINDINGS=""
          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -ri "$pattern" --include="*.kt" --include="*.kts" --include="*.properties" --exclude-dir=".git" . || true)
            if [ -n "$matches" ]; then
              echo "Found potential secrets for pattern: $pattern"
              echo "$matches" | head -5  # Show first 5 matches only
              FINDINGS="$FINDINGS\n$matches"
            fi
          done
          
          if [ -n "$FINDINGS" ]; then
            echo "⚠️ Potential secrets found - please review manually"
          else
            echo "✅ No obvious secrets detected in source code"
          fi

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📄 Generate License Report
        run: |
          echo "📄 Generating license compliance report..."
          
          # Check for license plugin
          # This would require adding to build.gradle.kts:
          # id("com.github.jk1.dependency-license-report") version "2.5"
          
          echo "ℹ️ To enable license reporting, add to build.gradle.kts:"
          echo 'plugins {'
          echo '    id("com.github.jk1.dependency-license-report") version "2.5"'
          echo '}'
          
          # Manual license check
          echo "🔍 Checking common dependency licenses..."
          ./gradlew dependencies --configuration runtimeClasspath | \
            grep -E "(Apache|MIT|BSD|LGPL|GPL|Eclipse|Mozilla)" || echo "No license information found in dependency output"

  build-security:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check Build Scripts Security
        run: |
          echo "🔍 Checking build scripts for security issues..."
          
          # Check for unsafe commands in build scripts
          UNSAFE_PATTERNS=(
            "curl.*|.*sh"
            "wget.*|.*sh"
            "eval"
            "rm -rf /"
            "sudo"
          )
          
          FILES_TO_CHECK=(
            "build-dmg.sh"
            "build-msi.bat"
            "gradlew"
            "*.gradle*"
          )
          
          SECURITY_ISSUES=""
          for pattern in "${UNSAFE_PATTERNS[@]}"; do
            for file_pattern in "${FILES_TO_CHECK[@]}"; do
              matches=$(find . -name "$file_pattern" -type f -exec grep -l "$pattern" {} \; 2>/dev/null || true)
              if [ -n "$matches" ]; then
                SECURITY_ISSUES="$SECURITY_ISSUES\nPotential security issue in: $matches (pattern: $pattern)"
              fi
            done
          done
          
          if [ -n "$SECURITY_ISSUES" ]; then
            echo "⚠️ Potential security issues found:"
            echo -e "$SECURITY_ISSUES"
          else
            echo "✅ No obvious security issues in build scripts"
          fi

      - name: 🔍 Verify Gradle Wrapper
        run: |
          echo "🔍 Verifying Gradle wrapper integrity..."
          
          # Check if gradle-wrapper.jar exists and has expected size
          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
          if [ -f "$WRAPPER_JAR" ]; then
            SIZE=$(stat -f%z "$WRAPPER_JAR" 2>/dev/null || stat -c%s "$WRAPPER_JAR" 2>/dev/null || echo "0")
            echo "Gradle wrapper size: $SIZE bytes"
            
            # Gradle wrapper should be around 60-70KB typically
            if [ "$SIZE" -gt 100000 ] || [ "$SIZE" -lt 30000 ]; then
              echo "⚠️ Gradle wrapper size seems unusual - please verify integrity"
            else
              echo "✅ Gradle wrapper size looks normal"
            fi
          else
            echo "❌ Gradle wrapper jar not found"
          fi

  summary:
    needs: [dependency-scan, secrets-scan, license-compliance, build-security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Security Audit Summary
        run: |
          echo "## 🛡️ Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Audit Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scan**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets Scan**: ${{ needs.secrets-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **License Compliance**: ${{ needs.license-compliance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Security**: ${{ needs.build-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.dependency-scan.result }}" == "success" && "${{ needs.secrets-scan.result }}" == "success" && "${{ needs.license-compliance.result }}" == "success" && "${{ needs.build-security.result }}" == "success" ]]; then
            echo "🎉 **Overall Status**: ✅ PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Overall Status**: REVIEW REQUIRED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Enable OWASP Dependency Check plugin for comprehensive vulnerability scanning" >> $GITHUB_STEP_SUMMARY
          echo "- Add license compliance reporting plugin for automated license tracking" >> $GITHUB_STEP_SUMMARY
          echo "- Review any flagged dependencies and update to latest secure versions" >> $GITHUB_STEP_SUMMARY
          echo "- Consider adding Snyk or similar security scanning tools" >> $GITHUB_STEP_SUMMARY