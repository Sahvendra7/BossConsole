name: 🚀 Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_increment:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      create_release:
        description: 'Create GitHub release'
        required: true
        default: true
        type: boolean

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-build: ${{ steps.check-changes.outputs.should-build }}
      updated-sha: ${{ steps.commit-version.outputs.updated-sha }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: 🔄 Increment Version (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Increment version based on input
          case "${{ github.event.inputs.version_increment }}" in
            "patch")
              ./gradlew incrementVersion
              ;;
            "minor")
              ./gradlew incrementMinor
              ;;
            "major")
              ./gradlew incrementMajor
              ;;
          esac
          
          # Get the new version
          NEW_VERSION=$(grep "^app.version=" version.properties | cut -d'=' -f2)
          echo "New version: $NEW_VERSION"

      - name: 📝 Commit Version Changes
        id: commit-version
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet version.properties; then
            echo "No version changes to commit"
            echo "updated-sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            # Commit version changes
            NEW_VERSION=$(grep "^app.version=" version.properties | cut -d'=' -f2)
            git add version.properties
            git commit -m "🔖 Bump version to $NEW_VERSION" \
                       -m "Auto-increment version for release build" \
                       -m "🤖 Automated by release workflow"
            
            # Push changes
            git push
            
            # Get the new commit SHA
            NEW_SHA=$(git rev-parse HEAD)
            echo "updated-sha=$NEW_SHA" >> $GITHUB_OUTPUT
            echo "✅ Version committed and pushed: $NEW_VERSION"
          fi

      - name: 📋 Get Version
        id: get-version
        run: |
          VERSION=$(grep "^app.version=" version.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: 🔍 Check for Changes
        id: check-changes
        run: |
          # Always build on tag push or manual trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
          fi

  build-macos:
    needs: prepare-version
    if: needs.prepare-version.outputs.should-build == 'true'
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.updated-sha }}

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔧 Setup Build Environment
        shell: bash
        run: |
          echo "🔧 Setting up build environment for ${{ matrix.platform }}"
          echo "📦 Version: ${{ needs.prepare-version.outputs.version }}"
          
          # Verify version consistency
          ./gradlew showVersion

      # macOS specific setup
      - name: 🍎 Setup macOS Environment
        run: |
          # Install required dependencies for DMG creation
          brew install --quiet create-dmg || true
          
          # Verify macOS build tools
          xcode-select --print-path
          
          # Setup macOS code signing environment with P12 certificate
          if [[ -n "${{ secrets.MACOS_P12_CERTIFICATE }}" ]]; then
            echo "🔐 Setting up macOS code signing with P12 certificate..."
            
            # Decode and install P12 certificate
            echo "${{ secrets.MACOS_P12_CERTIFICATE }}" | base64 --decode > certificate.p12
            
            # Create temporary keychain
            security create-keychain -p temp_password temp_keychain
            security default-keychain -s temp_keychain
            security unlock-keychain -p temp_password temp_keychain
            
            # Set keychain settings
            security set-keychain-settings -lut 3600 temp_keychain
            
            # Import certificate
            security import certificate.p12 -k temp_keychain -P "${{ secrets.MACOS_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
            
            # Allow codesign to access the key
            security set-key-partition-list -S apple-tool:,apple: -s -k temp_password temp_keychain
            
            # Ensure keychain is available for subsequent steps
            security list-keychains -s temp_keychain
            
            # Set up environment variables
            echo "DEVELOPER_ID=${{ secrets.MACOS_DEVELOPER_ID }}" >> $GITHUB_ENV
            echo "MACOS_DEVELOPER_ID=${{ secrets.MACOS_DEVELOPER_ID }}" >> $GITHUB_ENV
            echo "TEAM_ID=${{ secrets.MACOS_TEAM_ID }}" >> $GITHUB_ENV
            echo "APPLE_ID=${{ secrets.MACOS_APPLE_ID }}" >> $GITHUB_ENV
            echo "APP_PASSWORD=${{ secrets.MACOS_APP_PASSWORD }}" >> $GITHUB_ENV
            echo "DISABLE_MACOS_SIGNING=false" >> $GITHUB_ENV
            
            # Clean up certificate file
            rm certificate.p12
            
            # Verify certificate installation
            echo "🔍 Verifying certificate installation..."
            security find-identity -v -p codesigning temp_keychain
            
            echo "✅ macOS code signing configured with P12 certificate"
          else
            echo "⚠️ MACOS_P12_CERTIFICATE not found"
            echo "   Add your P12 certificate to GitHub secrets for production builds"
            echo "   Creating unsigned DMG for testing..."
            echo "DISABLE_MACOS_SIGNING=true" >> $GITHUB_ENV
          fi


      - name: 🏗️ Build macOS DMG
        env:
          DISABLE_MACOS_SIGNING: ${{ env.DISABLE_MACOS_SIGNING }}
        run: |
          echo "🏗️ Building macOS DMG..."
          
          # Debug environment variables
          echo "DISABLE_MACOS_SIGNING: $DISABLE_MACOS_SIGNING"
          
          # Make gradlew executable
          chmod +x ./gradlew
          
          # Build DMG
          ./gradlew packageDmg
          
          echo "✅ macOS DMG build completed successfully"

      # macOS notarization (only for signed DMGs)
      - name: 🍎 Notarize macOS DMG
        if: env.DISABLE_MACOS_SIGNING != 'true'
        run: |
          echo "🍎 Starting macOS notarization process..."
          
          # Find the DMG file
          DMG_PATH=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" | head -1)
          
          if [[ -n "$DMG_PATH" && -f "$DMG_PATH" ]]; then
            echo "📦 Found DMG: $DMG_PATH"
            
            # Submit for notarization
            echo "🔐 Submitting DMG for notarization..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APP_PASSWORD" \
              --team-id "${{ secrets.MACOS_TEAM_ID }}" \
              --wait
            
            # Staple the notarization
            echo "📎 Stapling notarization to DMG..."
            xcrun stapler staple "$DMG_PATH"
            
            echo "✅ macOS notarization completed"
          else
            echo "❌ DMG file not found for notarization"
            exit 1
          fi

      # Skip notarization info for unsigned builds
      - name: 🍎 Skip Notarization (Unsigned Build)
        if: env.DISABLE_MACOS_SIGNING == 'true'
        run: |
          echo "ℹ️ Skipping notarization for unsigned DMG"
          echo "   This DMG is for development/testing only"
          echo "   For distribution, add proper code signing certificates"

      - name: 📊 Verify Build Artifacts
        run: |
          echo "📊 Verifying macOS DMG..."
          
          # Check if DMG exists
          if ls composeApp/build/compose/binaries/main/dmg/*.dmg 1> /dev/null 2>&1; then
            echo "✅ DMG found!"
            ls -la composeApp/build/compose/binaries/main/dmg/
          else
            echo "❌ DMG not found!"
            exit 1
          fi

      - name: 📤 Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: boss-macos-${{ needs.prepare-version.outputs.version }}
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 30

  build-windows:
    needs: prepare-version
    if: needs.prepare-version.outputs.should-build == 'true'
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.updated-sha }}

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Setup Build Environment
        run: |
          echo "🔧 Setting up build environment for Windows"
          echo "📦 Version: ${{ needs.prepare-version.outputs.version }}"
          
          # Verify version consistency
          ./gradlew showVersion

      - name: 🏗️ Build Windows MSI
        run: |
          echo "🏗️ Building Windows MSI..."
          
          # Make gradlew executable and build
          ./gradlew packageMsi
          
          echo "✅ Windows MSI build completed successfully"

      - name: 🔐 Sign Windows MSI with DigiCert
        run: |
          Write-Host "🔐 Signing Windows MSI with DigiCert certificate..." -ForegroundColor Green
          
          # Find the MSI file
          $msiFiles = Get-ChildItem "composeApp/build/compose/binaries/main/msi/BOSS-*.msi" -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            Write-Host "❌ MSI file not found for signing" -ForegroundColor Red
            exit 1
          }
          
          $msiFile = $msiFiles[0].FullName
          Write-Host "📦 Found MSI: $msiFile" -ForegroundColor Yellow
          
          # Check if DigiCert secrets are available
          if (-not "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}") {
            Write-Host "⚠️ DigiCert certificate not found in secrets" -ForegroundColor Yellow
            Write-Host "   MSI will be uploaded unsigned for testing"
            return
          }
          
          # Setup DigiCert client certificate
          Write-Host "🔑 Setting up DigiCert client certificate..." -ForegroundColor Yellow
          $certBase64 = "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}"
          [System.Convert]::FromBase64String($certBase64) | Set-Content "Certificate_pkcs12.p12" -Encoding Byte
          
          if (-not (Test-Path "Certificate_pkcs12.p12")) {
            Write-Host "❌ Failed to create certificate file" -ForegroundColor Red
            exit 1
          }
          
          $certSize = (Get-Item "Certificate_pkcs12.p12").Length
          Write-Host "✅ Certificate ready: $certSize bytes" -ForegroundColor Green
          
          # Set DigiCert environment variables for certificate sync
          $env:SM_HOST = "https://clientauth.one.digicert.com"
          $env:SM_API_KEY = "${{ secrets.DIGICERT_API_KEY }}"
          $env:SM_CLIENT_CERT_FILE = "Certificate_pkcs12.p12"
          $env:SM_CLIENT_CERT_PASSWORD = "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          
          # Download and install DigiCert KeyLocker Tools (for certificate sync only)
          Write-Host "📥 Installing DigiCert KeyLocker Tools..." -ForegroundColor Yellow
          try {
            Invoke-WebRequest -Uri "https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download" -OutFile "Keylockertools-windows-x64.msi"
            Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "Keylockertools-windows-x64.msi", "/quiet", "/norestart" -Wait
            Remove-Item "Keylockertools-windows-x64.msi" -ErrorAction SilentlyContinue
            
            $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
            if (Test-Path $smctlPath) {
              Write-Host "✅ DigiCert tools installed" -ForegroundColor Green
              
              # Sync certificates to Windows certificate store
              Write-Host "🔄 Syncing certificates to Windows store..." -ForegroundColor Yellow
              & $smctlPath windows certsync 2>&1 | Out-Host
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Certificate sync completed" -ForegroundColor Green
              } else {
                Write-Host "⚠️ Certificate sync failed, proceeding with direct signing..." -ForegroundColor Yellow
              }
            }
          } catch {
            Write-Host "⚠️ DigiCert tools installation failed: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "   Proceeding with direct SignTool approach..." -ForegroundColor Yellow
          }
          
          # Find SignTool
          $signtoolPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe",
            "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools\x64\signtool.exe"
          )
          
          $signtoolPath = $null
          foreach ($path in $signtoolPaths) {
            if (Test-Path $path) {
              $signtoolPath = $path
              break
            }
          }
          
          if (-not $signtoolPath) {
            Write-Host "❌ SignTool not found!" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "🔧 Using SignTool: $signtoolPath" -ForegroundColor Cyan
          
          # Sign with automatic certificate selection (most reliable approach)
          Write-Host "🔐 Signing MSI with automatic certificate selection..." -ForegroundColor Yellow
          $signOutput = & $signtoolPath sign /a /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v "$msiFile" 2>&1
          
          Write-Host "📋 SignTool output:" -ForegroundColor Cyan
          Write-Host $signOutput
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ MSI signed successfully!" -ForegroundColor Green
            
            # Verify signature
            Write-Host "🔍 Verifying signature..." -ForegroundColor Yellow
            $verifyOutput = & $signtoolPath verify /pa /v "$msiFile" 2>&1
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Signature verification successful!" -ForegroundColor Green
            } else {
              Write-Host "⚠️ Signature verification failed, but file was signed successfully" -ForegroundColor Yellow
              Write-Host $verifyOutput
            }
            
            Write-Host "🎉 MSI signing completed: $msiFile" -ForegroundColor Green
          } else {
            Write-Host "❌ MSI signing failed!" -ForegroundColor Red
            Write-Host "Error output: $signOutput" -ForegroundColor Red
            
            # Fallback: Try with specific certificate thumbprint if available
            if ("${{ secrets.DIGICERT_CERTIFICATE_THUMBPRINT }}") {
              Write-Host "🔄 Attempting fallback signing with certificate thumbprint..." -ForegroundColor Yellow
              $thumbprint = "${{ secrets.DIGICERT_CERTIFICATE_THUMBPRINT }}"
              $fallbackOutput = & $signtoolPath sign /sha1 $thumbprint /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v "$msiFile" 2>&1
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Fallback signing successful!" -ForegroundColor Green
              } else {
                Write-Host "❌ Fallback signing also failed" -ForegroundColor Red
                Write-Host $fallbackOutput
                exit 1
              }
            } else {
              exit 1
            }
          }
          
          # Cleanup
          Remove-Item "Certificate_pkcs12.p12" -ErrorAction SilentlyContinue
        shell: powershell

      - name: 📊 Verify Build Artifacts
        run: |
          $msiPath = "composeApp/build/compose/binaries/main/msi/BOSS-*.msi"
          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "✅ MSI found: $($msiFiles[0].FullName)"
            Write-Host "   Size: $([math]::Round($msiFiles[0].Length/1MB,2)) MB"
          } else {
            Write-Host "❌ MSI not found at expected location"
            Write-Host "Searching for MSI files recursively..."
            $allMsi = Get-ChildItem "composeApp/build" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
            if ($allMsi) {
              Write-Host "Found MSI at: $($allMsi[0].FullName)"
            } else {
              Write-Host "No MSI files found anywhere in build directory"
              exit 1
            }
          }
        shell: powershell

      - name: 📤 Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: boss-windows-${{ needs.prepare-version.outputs.version }}
          path: composeApp/build/compose/binaries/main/msi/
          retention-days: 30

  create-release:
    needs: [prepare-version, build-macos, build-windows]
    if: needs.prepare-version.outputs.should-build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.updated-sha }}

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 📋 Prepare Release Assets
        run: |
          echo "📋 Preparing release assets..."
          mkdir -p ./release-assets
          
          # Copy and rename artifacts with consistent naming
          VERSION="${{ needs.prepare-version.outputs.version }}"
          
          # Find and copy artifacts
          find ./artifacts -name "*.dmg" -exec cp {} ./release-assets/BOSS-${VERSION}-Universal.dmg \;
          find ./artifacts -name "*.msi" -exec cp {} ./release-assets/BOSS-${VERSION}.msi \;
          
          # List final artifacts
          echo "📦 Release assets:"
          ls -la ./release-assets/

      - name: 📝 Generate Release Notes
        id: release-notes
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          
          # Generate release notes
          cat > release-notes.md << EOF
          # 🚀 BOSS $VERSION
          
          ## 📦 Downloads
          
          - **macOS**: \`BOSS-${VERSION}-Universal.dmg\` (Apple Silicon & Intel)
          - **Windows**: \`BOSS-${VERSION}.msi\` (x64)
          
          ## ✨ What's New
          
          - Auto-generated release for version $VERSION
          - Built with centralized version management system
          - All platforms synchronized and tested
          
          ## 🔧 System Requirements
          
          - **macOS**: macOS 11.0+ (Big Sur)
          - **Windows**: Windows 10+ (64-bit)
          
          ## 🛠️ Installation
          
          ### macOS
          1. Download \`BOSS-${VERSION}-Universal.dmg\`
          2. Open the DMG and drag BOSS to Applications
          3. Launch from Applications folder
          
          ### Windows
          1. Download \`BOSS-${VERSION}.msi\`
          2. Run the installer as Administrator
          3. Launch from Start Menu or Desktop
          
          ---
          
          🤖 *This release was automatically built and published by GitHub Actions*
          EOF
          
          # Set output for release creation
          echo "notes-file=release-notes.md" >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        if: github.event.inputs.create_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: 🚀 BOSS ${{ needs.prepare-version.outputs.version }}
          body_path: ${{ steps.release-notes.outputs.notes-file }}
          files: ./release-assets/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - name: 📢 Release Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Version**: ${{ needs.prepare-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Platforms Built**: macOS, Windows" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Release Created**: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS DMG (Universal)" >> $GITHUB_STEP_SUMMARY
          echo "- 🪟 Windows MSI (x64)" >> $GITHUB_STEP_SUMMARY

