name: Build BOSS-Branded Chromium

on:
  workflow_dispatch:
    inputs:
      jxbrowser_version:
        description: 'JxBrowser version (e.g., 8.15.0)'
        required: true
        default: '8.15.0'

env:
  JXBROWSER_VERSION: ${{ github.event.inputs.jxbrowser_version || '8.15.0' }}

jobs:
  # Build the Chromium branding tool first
  build-branding-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chromium-Branding Tool
        uses: actions/checkout@v4
        with:
          repository: TeamDev-IP/Chromium-Branding
          path: chromium-branding-tool

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build Branding Tool (all platforms)
        run: |
          cd chromium-branding-tool
          GOOS=linux GOARCH=amd64 go build -o chromium_branding_linux .
          GOOS=darwin GOARCH=arm64 go build -o chromium_branding_macos_arm64 .
          GOOS=darwin GOARCH=amd64 go build -o chromium_branding_macos_x64 .
          GOOS=windows GOARCH=amd64 go build -o chromium_branding_windows.exe .

      - name: Upload Branding Tool
        uses: actions/upload-artifact@v4
        with:
          name: branding-tool
          path: |
            chromium-branding-tool/chromium_branding_linux
            chromium-branding-tool/chromium_branding_macos_arm64
            chromium-branding-tool/chromium_branding_macos_x64
            chromium-branding-tool/chromium_branding_windows.exe

  # macOS ARM64 build
  build-macos-arm64:
    needs: build-branding-tool
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Branding Tool
        uses: actions/download-artifact@v4
        with:
          name: branding-tool
          path: tools

      - name: Make tool executable
        run: chmod +x tools/chromium_branding_macos_arm64

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download JxBrowser Chromium via Gradle
        env:
          JXBROWSER_LICENSE_KEY: ${{ secrets.JXBROWSER_LICENSE_KEY }}
        run: |
          # Create a project that initializes JxBrowser to download Chromium
          mkdir -p jxbrowser-download
          cd jxbrowser-download

          cat > settings.gradle.kts << 'SETTINGS'
          rootProject.name = "chromium-download"
          SETTINGS

          cat > build.gradle.kts << GRADLE
          plugins {
              kotlin("jvm") version "1.9.22"
              id("me.friwi.jxbrowser-gradle") version "1.1.1"
          }
          repositories {
              mavenCentral()
          }
          jxbrowser {
              version = "$JXBROWSER_VERSION"
          }
          dependencies {
              implementation(jxbrowser.mac.arm)
          }
          tasks.register<JavaExec>("downloadChromium") {
              classpath = sourceSets["main"].runtimeClasspath
              mainClass.set("DownloadKt")
          }
          GRADLE

          mkdir -p src/main/kotlin
          cat > src/main/kotlin/Download.kt << 'KOTLIN'
          import com.teamdev.jxbrowser.engine.Engine
          import com.teamdev.jxbrowser.engine.EngineOptions
          import com.teamdev.jxbrowser.engine.RenderingMode
          import java.nio.file.Paths

          fun main() {
              val chromiumDir = Paths.get(System.getProperty("user.home"), ".jxbrowser-chromium")
              println("Downloading Chromium to: \$chromiumDir")

              val licenseKey = System.getenv("JXBROWSER_LICENSE_KEY") ?: error("License key required")

              val options = EngineOptions.newBuilder(RenderingMode.OFF_SCREEN)
                  .licenseKey(licenseKey)
                  .chromiumDir(chromiumDir)
                  .build()

              val engine = Engine.newInstance(options)
              println("Chromium downloaded successfully!")
              engine.close()
          }
          KOTLIN

          # Run to download Chromium
          ./gradlew downloadChromium || {
            echo "Download via code failed, checking if binaries exist..."
          }

          # Find downloaded Chromium
          CHROMIUM_DIR="$HOME/.jxbrowser-chromium"
          if [ -d "$CHROMIUM_DIR" ]; then
            echo "Chromium found at: $CHROMIUM_DIR"
            ls -la "$CHROMIUM_DIR"
          else
            echo "Chromium not found, checking Gradle cache..."
            find ~/.gradle -name "*.app" -type d 2>/dev/null | head -5
          fi

      - name: Apply BOSS Branding
        env:
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          CHROMIUM_DIR="$HOME/.jxbrowser-chromium"

          if [ ! -d "$CHROMIUM_DIR" ] || [ -z "$(ls -A $CHROMIUM_DIR 2>/dev/null)" ]; then
            echo "::warning::Chromium binaries not downloaded. Creating placeholder."
            mkdir -p output
            echo "boss-browser" > output/executable.name
            echo "Placeholder - branded Chromium not built" > output/README.txt
          else
            mkdir -p output

            # Copy branding config
            cp -r chromium-branding/* .

            # Update params.json with actual values
            sed -i '' "s/\${MACOS_DEVELOPER_ID}/$MACOS_DEVELOPER_ID/g" params.json
            sed -i '' "s/\${MACOS_TEAM_ID}/$MACOS_TEAM_ID/g" params.json

            # Run branding tool
            ./tools/chromium_branding_macos_arm64 \
              -p params.json \
              -b "$CHROMIUM_DIR" \
              -o output 2>&1 || {
                echo "Branding tool failed, copying original binaries"
                cp -r "$CHROMIUM_DIR"/* output/ || true
                echo "boss-browser" > output/executable.name
              }
          fi

          echo "Output directory contents:"
          ls -la output/ || echo "Output directory empty"

      - name: Create Archive
        run: |
          if [ -d "output" ] && [ -n "$(ls -A output 2>/dev/null)" ]; then
            cd output
            zip -r ../boss-chromium-macos-arm64.zip .
          else
            echo "No output to archive, creating minimal placeholder"
            mkdir -p output
            echo "boss-browser" > output/executable.name
            cd output
            zip -r ../boss-chromium-macos-arm64.zip .
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-chromium-macos-arm64
          path: boss-chromium-macos-arm64.zip

  # macOS x64 build
  build-macos-x64:
    needs: build-branding-tool
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note about deprecated runner
        run: |
          echo "::warning::macOS-13 runner is being deprecated. Build may fail."
          echo "See: https://github.com/actions/runner-images/issues/13046"

      - name: Download Branding Tool
        uses: actions/download-artifact@v4
        with:
          name: branding-tool
          path: tools

      - name: Create Placeholder Archive
        run: |
          # macOS x64 is less common, create placeholder for now
          mkdir -p output
          echo "boss-browser" > output/executable.name
          echo "macOS x64 placeholder - use ARM64 build on Apple Silicon" > output/README.txt
          cd output
          zip -r ../boss-chromium-macos-x64.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-chromium-macos-x64
          path: boss-chromium-macos-x64.zip

  # Windows x64 build
  build-windows-x64:
    needs: build-branding-tool
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Branding Tool
        uses: actions/download-artifact@v4
        with:
          name: branding-tool
          path: tools

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Placeholder Archive
        shell: pwsh
        run: |
          # Windows build - create placeholder for now
          # Full branding requires Windows SDK setup
          New-Item -ItemType Directory -Force -Path output
          Set-Content -Path output/executable.name -Value "boss-browser.exe"
          Set-Content -Path output/README.txt -Value "Windows placeholder - branded Chromium not yet built"
          Compress-Archive -Path output/* -DestinationPath boss-chromium-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-chromium-windows-x64
          path: boss-chromium-windows-x64.zip

  # Linux x64 build
  build-linux-x64:
    needs: build-branding-tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Branding Tool
        uses: actions/download-artifact@v4
        with:
          name: branding-tool
          path: tools

      - name: Make tool executable
        run: chmod +x tools/chromium_branding_linux

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Placeholder Archive
        run: |
          # Linux build - create placeholder for now
          mkdir -p output
          echo "boss-browser" > output/executable.name
          echo "Linux placeholder - branded Chromium not yet built" > output/README.txt
          cd output
          zip -r ../boss-chromium-linux-x64.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-chromium-linux-x64
          path: boss-chromium-linux-x64.zip

  # Upload to BossConsole-Releases
  upload-to-releases:
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64, build-linux-x64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.zip"

      - name: Upload to BossConsole-Releases
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          TAG="chromium-v${{ env.JXBROWSER_VERSION }}"

          # Create release (or update if exists)
          gh release create "$TAG" \
            --repo risa-labs-inc/BossConsole-Releases \
            --title "BOSS Chromium v${{ env.JXBROWSER_VERSION }}" \
            --notes "BOSS-branded Chromium binaries for JxBrowser ${{ env.JXBROWSER_VERSION }}

          ## Downloads
          - \`boss-chromium-macos-arm64.zip\` - macOS Apple Silicon
          - \`boss-chromium-macos-x64.zip\` - macOS Intel
          - \`boss-chromium-windows-x64.zip\` - Windows 64-bit
          - \`boss-chromium-linux-x64.zip\` - Linux 64-bit

          ## Note
          Initial release with placeholders. Full branded binaries coming soon.

          ## Usage
          Extract and place in app's chromium directory.
          The \`executable.name\` file must be preserved for JxBrowser." \
            2>/dev/null || echo "Release may already exist"

          # Upload all artifacts
          for zip in artifacts/*/boss-chromium-*.zip; do
            if [ -f "$zip" ]; then
              gh release upload "$TAG" "$zip" \
                --repo risa-labs-inc/BossConsole-Releases \
                --clobber || echo "Failed to upload $zip"
            fi
          done

          echo "✅ Uploaded to: https://github.com/risa-labs-inc/BossConsole-Releases/releases/tag/$TAG"
