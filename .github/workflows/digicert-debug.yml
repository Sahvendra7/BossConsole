name: 🔍 Debug DigiCert Signing

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file to create and sign'
        required: false
        default: 'test-app.exe'
        type: string

jobs:
  debug-signing:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Create Test Executable
        run: |
          Write-Host "Creating test executable for DigiCert signing debug..."
          
          # Create a simple test executable
          $testContent = @"
using System;
namespace TestApp {
    class Program {
        static void Main() {
            Console.WriteLine("DigiCert Signing Debug Test");
        }
    }
}
"@
          
          $testContent | Out-File -FilePath "TestApp.cs" -Encoding UTF8
          
          # Compile to create an executable
          Add-Type -TypeDefinition $testContent -OutputAssembly "${{ github.event.inputs.test_file }}"
          
          if (Test-Path "${{ github.event.inputs.test_file }}") {
            Write-Host "✅ Test executable created: ${{ github.event.inputs.test_file }}"
            $fileInfo = Get-Item "${{ github.event.inputs.test_file }}"
            Write-Host "File size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "❌ Failed to create test executable"
            exit 1
          }
        shell: powershell

      - name: 🔐 Debug DigiCert Signing Process
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=== DigiCert Signing Debug Session ==="
          Write-Host "Test file: ${{ github.event.inputs.test_file }}"
          
          # Check DigiCert secrets
          $apiKey = "${{ secrets.DIGICERT_API_KEY }}"
          $clientKey = "${{ secrets.DIGICERT_CLIENT_AUTH_KEY }}"
          $certId = "${{ secrets.DIGICERT_CERTIFICATE_ID }}"
          $thumbprint = "${{ secrets.DIGICERT_CERTIFICATE_THUMBPRINT }}"
          $certBase64 = "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}"
          
          Write-Host ""
          Write-Host "=== Checking DigiCert Configuration ==="
          Write-Host "API Key: $(if($apiKey) { 'Present (' + $apiKey.Substring(0,10) + '...)' } else { 'MISSING' })"
          Write-Host "Client Key: $(if($clientKey) { 'Present' } else { 'MISSING' })"
          Write-Host "Certificate ID: $(if($certId) { $certId } else { 'MISSING' })"
          Write-Host "Thumbprint: $(if($thumbprint) { $thumbprint } else { 'Not set (optional)' })"
          Write-Host "Client Cert Base64: $(if($certBase64) { 'Present (' + $certBase64.Substring(0,20) + '...)' } else { 'MISSING' })"
          
          if (-not ($apiKey -and $clientKey -and $certId -and $certBase64)) {
            Write-Host ""
            Write-Host "❌ MISSING REQUIRED SECRETS:"
            if (-not $apiKey) { Write-Host "  - DIGICERT_API_KEY" }
            if (-not $clientKey) { Write-Host "  - DIGICERT_CLIENT_AUTH_KEY" }
            if (-not $certId) { Write-Host "  - DIGICERT_CERTIFICATE_ID" }
            if (-not $certBase64) { Write-Host "  - DIGICERT_CLIENT_CERT_BASE64" }
            Write-Host ""
            Write-Host "Please add these secrets to test DigiCert signing"
            exit 1
          }
          
          Write-Host ""
          Write-Host "✅ All required secrets found, proceeding with debug..."
          
          # Download and install DigiCert tools
          Write-Host ""
          Write-Host "=== Installing DigiCert KeyLocker Tools ==="
          try {
            gh release download keylocker-tools --pattern "Keylockertools-windows-x64.msi" --clobber
            
            if (Test-Path "Keylockertools-windows-x64.msi") {
              $fileSize = (Get-Item "Keylockertools-windows-x64.msi").Length
              Write-Host "✅ Downloaded DigiCert tools: $([math]::Round($fileSize/1MB,2)) MB"
              
              # Install
              $installProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "Keylockertools-windows-x64.msi", "/quiet", "/norestart" -Wait -PassThru
              Write-Host "Installation exit code: $($installProcess.ExitCode)"
              
              # Verify installation
              $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
              if (Test-Path $smctlPath) {
                Write-Host "✅ DigiCert tools installed at: $smctlPath"
              } else {
                Write-Host "❌ Installation verification failed"
                # Search for smctl
                $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "smctl.exe" -ErrorAction SilentlyContinue
                if ($found) {
                  Write-Host "Found smctl.exe at: $($found[0].FullName)"
                  $smctlPath = $found[0].FullName
                } else {
                  Write-Host "smctl.exe not found anywhere"
                  exit 1
                }
              }
              
            } else {
              Write-Host "❌ Failed to download DigiCert tools"
              exit 1
            }
          } catch {
            Write-Host "❌ Error installing DigiCert tools: $($_.Exception.Message)"
            exit 1
          }
          
          # Set up environment
          Write-Host ""
          Write-Host "=== Setting Up DigiCert Environment ==="
          $env:SM_HOST = "https://clientauth.one.digicert.com"
          $env:SM_API_KEY = $apiKey
          $env:SM_CLIENT_CERT_FILE = "Certificate_pkcs12.p12"
          $env:SM_CLIENT_CERT_PASSWORD = $clientKey
          if ($thumbprint) {
            $env:SM_CODE_SIGNING_CERT_SHA1_HASH = $thumbprint
          }
          
          Write-Host "Environment variables set:"
          Write-Host "  SM_HOST: $env:SM_HOST"
          Write-Host "  SM_API_KEY: $(if($env:SM_API_KEY) { $env:SM_API_KEY.Substring(0,10) + '...' } else { 'Not set' })"
          Write-Host "  SM_CLIENT_CERT_FILE: $env:SM_CLIENT_CERT_FILE"
          Write-Host "  SM_CLIENT_CERT_PASSWORD: [REDACTED]"
          Write-Host "  SM_CODE_SIGNING_CERT_SHA1_HASH: $env:SM_CODE_SIGNING_CERT_SHA1_HASH"
          
          # Setup client certificate
          Write-Host ""
          Write-Host "=== Setting Up Client Certificate ==="
          try {
            [System.Convert]::FromBase64String($certBase64) | Set-Content "Certificate_pkcs12.p12" -Encoding Byte
            $certInfo = Get-Item "Certificate_pkcs12.p12"
            Write-Host "✅ Client certificate created: $($certInfo.Length) bytes"
          } catch {
            Write-Host "❌ Failed to create client certificate: $($_.Exception.Message)"
            exit 1
          }
          
          # Test DigiCert connection
          Write-Host ""
          Write-Host "=== Testing DigiCert Connection ==="
          try {
            Write-Host "Running: smctl.exe healthcheck"
            & $smctlPath healthcheck
            $healthCode = $LASTEXITCODE
            Write-Host "Health check exit code: $healthCode"
            if ($healthCode -ne 0) {
              Write-Host "⚠️ Health check failed - may indicate connection/auth issues"
            } else {
              Write-Host "✅ Health check passed"
            }
          } catch {
            Write-Host "❌ Health check exception: $($_.Exception.Message)"
          }
          
          # List available certificates
          Write-Host ""
          Write-Host "=== Listing Available Certificates ==="
          try {
            Write-Host "Running: smctl.exe keypair ls"
            & $smctlPath keypair ls
            $listCode = $LASTEXITCODE
            Write-Host "Keypair list exit code: $listCode"
            if ($listCode -ne 0) {
              Write-Host "⚠️ Failed to list certificates - check API key and authentication"
            }
          } catch {
            Write-Host "❌ Keypair listing exception: $($_.Exception.Message)"
          }
          
          # Test signing with detailed output
          Write-Host ""
          Write-Host "=== Testing File Signing ==="
          $testFile = "${{ github.event.inputs.test_file }}"
          if (Test-Path $testFile) {
            try {
              Write-Host "Signing file: $testFile"
              Write-Host "Using certificate ID: $certId"
              Write-Host "Command: smctl.exe sign --keypair-alias=$certId --input=$testFile --verbose"
              
              # Run with verbose output
              & $smctlPath sign --keypair-alias=$certId --input=$testFile --verbose
              $signCode = $LASTEXITCODE
              Write-Host "Signing exit code: $signCode"
              
              if ($signCode -eq 0) {
                Write-Host "✅ Signing completed successfully!"
                
                # Verify signature
                Write-Host ""
                Write-Host "=== Verifying Signature ==="
                $signtoolPaths = @(
                  "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
                  "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
                )
                
                foreach ($signtoolPath in $signtoolPaths) {
                  if (Test-Path $signtoolPath) {
                    Write-Host "Using signtool: $signtoolPath"
                    & $signtoolPath verify /pa $testFile
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host "✅ Signature verification successful!"
                    } else {
                      Write-Host "⚠️ Signature verification failed"
                    }
                    break
                  }
                }
              } else {
                Write-Host "❌ Signing failed with exit code: $signCode"
                Write-Host "This usually indicates:"
                Write-Host "  - Wrong certificate ID/alias"
                Write-Host "  - Invalid API authentication"
                Write-Host "  - Certificate not found or expired"
                Write-Host "  - Network connectivity issues"
              }
              
            } catch {
              Write-Host "❌ Signing exception: $($_.Exception.Message)"
            }
          } else {
            Write-Host "❌ Test file not found: $testFile"
          }
          
          # Cleanup
          Write-Host ""
          Write-Host "=== Cleanup ==="
          Remove-Item "Certificate_pkcs12.p12" -ErrorAction SilentlyContinue
          Remove-Item "Keylockertools-windows-x64.msi" -ErrorAction SilentlyContinue
          Write-Host "Debug session completed"
        shell: powershell

      - name: 📋 Debug Summary
        run: |
          Write-Host "=== DigiCert Debug Summary ==="
          Write-Host "This debug workflow provides detailed information about:"
          Write-Host "  1. DigiCert secrets configuration"
          Write-Host "  2. Tool installation verification"
          Write-Host "  3. Connection testing"
          Write-Host "  4. Available certificates"
          Write-Host "  5. Detailed signing process with verbose output"
          Write-Host "  6. Signature verification"
          Write-Host ""
          Write-Host "Check the logs above for specific error messages and next steps."
        shell: powershell