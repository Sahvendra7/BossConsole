name: 🔍 Debug Code Signing

on:
  workflow_dispatch:

jobs:
  debug-certificates:
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Debug Certificate Setup
        run: |
          echo "🔍 Debugging macOS code signing setup..."
          
          # Check if secrets are available
          if [[ -n "${{ secrets.MACOS_P12_CERTIFICATE }}" ]]; then
            echo "✅ MACOS_P12_CERTIFICATE is available"
          else
            echo "❌ MACOS_P12_CERTIFICATE is missing"
          fi
          
          if [[ -n "${{ secrets.MACOS_P12_PASSWORD }}" ]]; then
            echo "✅ MACOS_P12_PASSWORD is available"
          else
            echo "❌ MACOS_P12_PASSWORD is missing"
          fi
          
          if [[ -n "${{ secrets.MACOS_DEVELOPER_ID }}" ]]; then
            echo "✅ MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}"
          else
            echo "❌ MACOS_DEVELOPER_ID is missing"
          fi
          
          # Try to set up certificate
          if [[ -n "${{ secrets.MACOS_P12_CERTIFICATE }}" ]]; then
            echo "🔐 Setting up P12 certificate..."
            
            # Decode certificate
            echo "${{ secrets.MACOS_P12_CERTIFICATE }}" | base64 --decode > certificate.p12
            echo "📦 Certificate file size: $(ls -la certificate.p12)"
            
            # Create keychain
            security create-keychain -p temp_password temp_keychain
            security default-keychain -s temp_keychain
            security unlock-keychain -p temp_password temp_keychain
            security set-keychain-settings -lut 3600 temp_keychain
            
            # Import certificate
            echo "📥 Importing certificate..."
            security import certificate.p12 -k temp_keychain -P "${{ secrets.MACOS_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
            
            # Set key partition
            security set-key-partition-list -S apple-tool:,apple: -s -k temp_password temp_keychain
            
            # Check what's in keychain
            echo "🔍 Certificates in keychain:"
            security find-identity -v -p codesigning temp_keychain
            
            # Clean up
            rm certificate.p12
            
            echo "✅ Certificate setup completed"
          else
            echo "❌ Cannot set up certificate - MACOS_P12_CERTIFICATE missing"
          fi

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🏗️ Test Build
        env:
          DISABLE_MACOS_SIGNING: false
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: |
          echo "🏗️ Testing Gradle build..."
          chmod +x ./gradlew
          
          echo "Environment variables:"
          echo "DISABLE_MACOS_SIGNING: $DISABLE_MACOS_SIGNING"
          echo "MACOS_DEVELOPER_ID: $MACOS_DEVELOPER_ID"
          
          # Try to build
          ./gradlew packageDmg || echo "Build failed - checking why..."