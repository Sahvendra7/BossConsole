name: 🔧 Test DigiCert KeyLocker Tools Download

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of download test to run'
        required: false
        default: 'github-release'
        type: choice
        options:
          - github-release
          - direct-urls
          - both

jobs:
  test-download:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Test DigiCert KeyLocker Tools Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=== DigiCert KeyLocker Tools Download Test ==="
          Write-Host "Test type: ${{ github.event.inputs.test_type }}"
          Write-Host "Testing download and installation of DigiCert tools..."
          
          $testType = "${{ github.event.inputs.test_type }}"
          $downloadSuccess = $false
          $downloadMethod = ""
          
          # Test GitHub Release download (our preferred method)
          if ($testType -eq "github-release" -or $testType -eq "both") {
            Write-Host ""
            Write-Host "=== Testing GitHub Release Download ==="
            Write-Host "Using GitHub CLI to download from private repository release"
            
            try {
              Write-Host "Downloading DigiCert KeyLocker Tools from GitHub release using gh CLI..."
              
              # Download with retry logic using GitHub CLI
              $maxRetries = 3
              for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
                try {
                  Write-Host "  Attempt $attempt/$maxRetries..."
                  Write-Host "  Running: gh release download keylocker-tools --pattern Keylockertools-windows-x64.msi"
                  
                  # Use GitHub CLI to download from private repository
                  gh release download keylocker-tools --pattern "Keylockertools-windows-x64.msi" --clobber
                  
                  # Verify download
                  if (Test-Path "Keylockertools-windows-x64.msi") {
                    $fileSize = (Get-Item "Keylockertools-windows-x64.msi").Length
                    Write-Host "  ✅ Download successful! File size: $([math]::Round($fileSize/1MB,2)) MB"
                    $downloadSuccess = $true
                    $downloadMethod = "GitHub CLI"
                    break
                  } else {
                    Write-Host "  ❌ File not found after gh download"
                  }
                } catch {
                  Write-Host "  ❌ Attempt $attempt failed: $($_.Exception.Message)"
                  if ($attempt -lt $maxRetries) {
                    Write-Host "  ⏳ Retrying in 5 seconds..."
                    Start-Sleep -Seconds 5
                  }
                }
              }
              
              if (-not $downloadSuccess) {
                Write-Host "❌ GitHub CLI download failed after $maxRetries attempts"
              }
              
            } catch {
              Write-Host "❌ GitHub CLI download exception: $($_.Exception.Message)"
            }
          }
          
          # Test direct DigiCert URLs (fallback methods)
          if (($testType -eq "direct-urls" -or $testType -eq "both") -and -not $downloadSuccess) {
            Write-Host ""
            Write-Host "=== Testing Direct DigiCert URLs ==="
            
            $directUrls = @(
              "https://software.digicert.com/smstools/win/KeyLockerTools.exe",
              "https://one.digicert.com/signingmanager/api-ui/v1/releases/KeylockerTools-windows-x64.exe"
            )
            
            foreach ($url in $directUrls) {
              if ($downloadSuccess) { break }
              
              Write-Host "Testing URL: $url"
              try {
                Write-Host "  Downloading..."
                $fileName = Split-Path $url -Leaf
                Invoke-WebRequest -Uri $url -OutFile $fileName -TimeoutSec 120
                
                if (Test-Path $fileName) {
                  $fileSize = (Get-Item $fileName).Length
                  Write-Host "  ✅ Download successful! File: $fileName, Size: $([math]::Round($fileSize/1MB,2)) MB"
                  $downloadSuccess = $true
                  $downloadMethod = "Direct URL: $url"
                  
                  # Rename to standard name for installation test
                  if ($fileName -ne "Keylockertools-windows-x64.msi") {
                    Move-Item $fileName "Keylockertools-windows-x64.msi" -Force
                  }
                  break
                } else {
                  Write-Host "  ❌ File not found after download"
                }
              } catch {
                Write-Host "  ❌ Failed: $($_.Exception.Message)"
              }
            }
          }
          
          # Test installation if download was successful
          if ($downloadSuccess) {
            Write-Host ""
            Write-Host "=== Testing Installation ==="
            Write-Host "Download method used: $downloadMethod"
            
            try {
              Write-Host "Installing DigiCert KeyLocker Tools..."
              Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "Keylockertools-windows-x64.msi", "/quiet", "/norestart" -Wait -TimeoutSec 300
              
              # Verify installation
              $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
              if (Test-Path $smctlPath) {
                Write-Host "✅ DigiCert KeyLocker Tools installed successfully"
                Write-Host "   Installation path: $smctlPath"
                
                # Test smctl command
                Write-Host ""
                Write-Host "=== Testing smctl Command ==="
                try {
                  Write-Host "Running: smctl.exe --version"
                  & $smctlPath --version
                  Write-Host "✅ smctl command working (exit code: $LASTEXITCODE)"
                } catch {
                  Write-Host "⚠️ smctl command test failed: $($_.Exception.Message)"
                }
                
              } else {
                Write-Host "❌ DigiCert tools installation verification failed"
                Write-Host "   Expected path: $smctlPath"
                
                # Search for installation
                Write-Host "Searching for DigiCert installation..."
                $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "smctl.exe" -ErrorAction SilentlyContinue
                if ($found) {
                  Write-Host "Found smctl.exe at: $($found[0].FullName)"
                } else {
                  Write-Host "smctl.exe not found anywhere"
                }
              }
              
            } catch {
              Write-Host "❌ Installation failed: $($_.Exception.Message)"
            }
            
            # Cleanup
            Write-Host ""
            Write-Host "=== Cleanup ==="
            Remove-Item "Keylockertools-windows-x64.msi" -ErrorAction SilentlyContinue
            Write-Host "Cleanup completed"
            
          } else {
            Write-Host ""
            Write-Host "❌ All download methods failed"
            Write-Host "Cannot proceed with installation test"
          }
          
          # Final summary
          Write-Host ""
          Write-Host "=== Test Summary ==="
          if ($downloadSuccess) {
            Write-Host "✅ Download test: PASSED ($downloadMethod)"
            Write-Host "✅ Installation test: COMPLETED"
          } else {
            Write-Host "❌ Download test: FAILED"
            Write-Host "❌ Installation test: SKIPPED"
          }
        shell: powershell

      - name: 📋 Test Results Summary
        run: |
          Write-Host "=== DigiCert KeyLocker Tools Test Results ==="
          Write-Host "This workflow tests the download and installation of DigiCert KeyLocker Tools"
          Write-Host "Check the logs above for detailed results of:"
          Write-Host "  1. Download from GitHub release (preferred method)"
          Write-Host "  2. Download from direct DigiCert URLs (fallback)"
          Write-Host "  3. Installation verification"
          Write-Host "  4. smctl command functionality test"
        shell: powershell