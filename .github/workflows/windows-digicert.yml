name: 🪟 Windows DigiCert Build & Sign

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 8.9.4)'
        required: false
        default: 'current'
        type: string

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📋 Get Current Version
        id: get-version
        run: |
          if ("${{ github.event.inputs.version }}" -eq "current") {
            $VERSION = (Get-Content version.properties | Where-Object { $_ -match "^app.version=" } | ForEach-Object { $_.Split("=")[1] })
          } else {
            $VERSION = "${{ github.event.inputs.version }}"
          }
          Write-Host "Building version: $VERSION"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: 🔧 Setup Build Environment
        run: |
          Write-Host "Setting up build environment for Windows"
          Write-Host "Version: ${{ steps.get-version.outputs.version }}"
          
          # Verify version consistency
          ./gradlew showVersion
        shell: powershell

      - name: 🏗️ Build Windows MSI
        run: |
          Write-Host "Building Windows MSI..."
          
          # Make gradlew executable and build
          ./gradlew packageMsi
          
          Write-Host "Windows MSI build completed successfully"
        shell: powershell

      - name: 🔐 Sign Windows MSI with DigiCert
        run: |
          Write-Host "Setting up DigiCert code signing for Windows MSI..."
          
          # Find the MSI file
          $msiPath = "composeApp/build/compose/binaries/main/msi/BOSS-*.msi"
          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          
          if ($msiFiles) {
            $msiFile = $msiFiles[0].FullName
            Write-Host "Found MSI file: $msiFile"
            
            # Check if DigiCert secrets are available
            $apiKey = "${{ secrets.DIGICERT_API_KEY }}"
            $clientKey = "${{ secrets.DIGICERT_CLIENT_AUTH_KEY }}"
            if ($apiKey -and $clientKey) {
              Write-Host "DigiCert credentials found, proceeding with code signing..."
              
              # Download and install DigiCert signing tools
              Write-Host "Installing DigiCert signing tools..."
              
              # Try alternative URLs for DigiCert KeyLocker Tools
              $downloadSuccess = $false
              $urls = @(
                "https://software.digicert.com/smstools/win/KeyLockerTools.exe",
                "https://one.digicert.com/signingmanager/api-ui/v1/releases/KeylockerTools-windows-x64.exe"
              )
              
              foreach ($url in $urls) {
                try {
                  Write-Host "Trying to download from: $url"
                  Invoke-WebRequest -Uri $url -OutFile "KeyLockerTools.exe" -TimeoutSec 60
                  $downloadSuccess = $true
                  Write-Host "Downloaded DigiCert tools successfully"
                  break
                } catch {
                  Write-Host "Failed to download from $url : $($_.Exception.Message)"
                }
              }
              
              if (-not $downloadSuccess) {
                Write-Host "Failed to download DigiCert tools from all URLs"
                Write-Host "Attempting to use pre-installed signing tools or skip signing..."
                
                # Check if tools are already available
                $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
                if (Test-Path $smctlPath) {
                  Write-Host "Found existing DigiCert tools at $smctlPath"
                } else {
                  Write-Host "DigiCert tools not available, MSI will be uploaded unsigned"
                  return
                }
              } else {
                # Install the downloaded tools
                Write-Host "Installing DigiCert KeyLocker Tools..."
                Start-Process -FilePath "KeyLockerTools.exe" -ArgumentList "/S" -Wait
                Write-Host "DigiCert tools installed successfully"
              }
              
              # Set environment variables
              $env:SM_HOST = "https://clientauth.one.digicert.com"
              $env:SM_API_KEY = $apiKey
              $env:SM_CLIENT_CERT_FILE = "Certificate_pkcs12.p12"
              $env:SM_CLIENT_CERT_PASSWORD = $clientKey
              $env:SM_CODE_SIGNING_CERT_SHA1_HASH = "${{ secrets.DIGICERT_CERTIFICATE_THUMBPRINT }}"
              
              # Setup DigiCert client certificate
              Write-Host "Setting up DigiCert client authentication..."
              $certBase64 = "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}"
              [System.Convert]::FromBase64String($certBase64) | Set-Content "Certificate_pkcs12.p12" -Encoding Byte
              
              # Sign the MSI file
              Write-Host "Signing MSI file with DigiCert certificate..."
              $smctlPath = "C:\Program Files\DigiCert\DigiCert Keylocker Tools\smctl.exe"
              
              if (Test-Path $smctlPath) {
                try {
                  & $smctlPath sign --keypair-alias="${{ secrets.DIGICERT_CERTIFICATE_ID }}" --input="$msiFile"
                  
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "MSI file signed successfully with DigiCert"
                    
                    # Verify the signature
                    Write-Host "Verifying MSI signature..."
                    $signtoolPaths = @(
                      "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
                      "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe",
                      "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools\x64\signtool.exe"
                    )
                    
                    $signtoolFound = $false
                    foreach ($signtoolPath in $signtoolPaths) {
                      if (Test-Path $signtoolPath) {
                        Write-Host "Using signtool at: $signtoolPath"
                        & $signtoolPath verify /pa "$msiFile"
                        if ($LASTEXITCODE -eq 0) {
                          Write-Host "MSI signature verified successfully"
                        } else {
                          Write-Host "MSI signature verification failed, but signing completed"
                        }
                        $signtoolFound = $true
                        break
                      }
                    }
                    
                    if (-not $signtoolFound) {
                      Write-Host "Signtool not found, but MSI was signed successfully"
                    }
                  } else {
                    Write-Host "Failed to sign MSI file (exit code: $LASTEXITCODE)"
                    Write-Host "MSI will be uploaded unsigned"
                  }
                } catch {
                  Write-Host "Exception during signing: $($_.Exception.Message)"
                  Write-Host "MSI will be uploaded unsigned"
                }
              } else {
                Write-Host "DigiCert smctl.exe not found at expected location"
                Write-Host "MSI will be uploaded unsigned"
              }
              
              # Cleanup
              Remove-Item "Certificate_pkcs12.p12" -ErrorAction SilentlyContinue
              
            } else {
              Write-Host "DigiCert API credentials not found"
              Write-Host "Add DIGICERT_API_KEY and DIGICERT_CLIENT_AUTH_KEY secrets for production builds"
              Write-Host "MSI will be uploaded unsigned for testing"
            }
          } else {
            Write-Host "MSI file not found for signing"
            exit 1
          }
        shell: powershell

      - name: 📊 Verify Build Artifacts
        run: |
          $msiPath = "composeApp/build/compose/binaries/main/msi/BOSS-*.msi"
          $msiFiles = Get-ChildItem $msiPath -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "MSI found: $($msiFiles[0].FullName)"
            Write-Host "Size: $([math]::Round($msiFiles[0].Length/1MB,2)) MB"
          } else {
            Write-Host "MSI not found at expected location"
            Write-Host "Searching for MSI files recursively..."
            $allMsi = Get-ChildItem "composeApp/build" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
            if ($allMsi) {
              Write-Host "Found MSI at: $($allMsi[0].FullName)"
            } else {
              Write-Host "No MSI files found anywhere in build directory"
              exit 1
            }
          }
        shell: powershell

      - name: 📤 Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: boss-windows-digicert-${{ steps.get-version.outputs.version }}
          path: composeApp/build/compose/binaries/main/msi/
          retention-days: 7

      - name: 📋 Summary
        run: |
          Write-Host "=== Windows DigiCert Build Summary ==="
          Write-Host "Version: ${{ steps.get-version.outputs.version }}"
          Write-Host "MSI built and signed with DigiCert (if configured)"
          Write-Host "Artifact uploaded for download"
        shell: powershell