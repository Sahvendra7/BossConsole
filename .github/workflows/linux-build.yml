name: 🐧 Linux Build & Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 📋 Show Version
        run: ./gradlew showVersion

      - name: 🔍 Check Available Tasks
        run: |
          echo "🔍 Checking available Gradle tasks..."
          echo ""
          echo "📦 Looking for packaging tasks:"
          ./gradlew tasks --all | grep -i package || echo "No tasks found with 'package' in name"
          echo ""
          echo "🐧 Looking for Linux/DEB/RPM tasks:"
          ./gradlew tasks --all | grep -i -E "(deb|rpm|linux|appimage)" || echo "No Linux-specific packaging tasks found"
          echo ""
          echo "📋 All available tasks:"
          ./gradlew tasks

      - name: 🏗️ Build Application
        run: |
          echo "🏗️ Building Linux application..."
          ./gradlew build -x test
          echo "✅ Linux build completed successfully"

      - name: 📦 Try Package Tasks (Experimental)
        run: |
          echo "📦 Attempting to create packages with available tasks..."
          
          # Try common Compose packaging task names
          echo "Trying packageDistributionForCurrentOS..."
          ./gradlew packageDistributionForCurrentOS || echo "❌ packageDistributionForCurrentOS not available"
          
          echo "Trying packageReleaseDistributionForCurrentOS..."
          ./gradlew packageReleaseDistributionForCurrentOS || echo "❌ packageReleaseDistributionForCurrentOS not available"
          
          echo "Trying createDistributable..."
          ./gradlew createDistributable || echo "❌ createDistributable not available"
          
          echo "Trying :composeApp:packageDistributionForCurrentOS..."
          ./gradlew :composeApp:packageDistributionForCurrentOS || echo "❌ :composeApp:packageDistributionForCurrentOS not available"

      - name: 🔍 Find Generated Files
        id: find-packages
        run: |
          echo "🔍 Searching for any generated distribution files..."
          
          # Search for any distribution files in build directory
          echo "📁 Contents of composeApp/build/:"
          find composeApp/build -type f -name "*" 2>/dev/null | head -20 || echo "Build directory not found or empty"
          
          echo ""
          echo "🔍 Looking for specific package types:"
          
          # Find any potential Linux packages
          DEB_FILES=$(find . -name "*.deb" -type f 2>/dev/null | head -1)
          if [[ -n "$DEB_FILES" && -f "$DEB_FILES" ]]; then
            echo "deb-path=$DEB_FILES" >> $GITHUB_OUTPUT
            echo "✅ Found DEB: $DEB_FILES"
          else
            echo "⚠️ No DEB files found"
          fi
          
          RPM_FILES=$(find . -name "*.rpm" -type f 2>/dev/null | head -1)
          if [[ -n "$RPM_FILES" && -f "$RPM_FILES" ]]; then
            echo "rpm-path=$RPM_FILES" >> $GITHUB_OUTPUT
            echo "✅ Found RPM: $RPM_FILES"
          else
            echo "⚠️ No RPM files found"
          fi
          
          APPIMAGE_FILES=$(find . -name "*.AppImage" -type f 2>/dev/null | head -1)
          if [[ -n "$APPIMAGE_FILES" && -f "$APPIMAGE_FILES" ]]; then
            echo "appimage-path=$APPIMAGE_FILES" >> $GITHUB_OUTPUT
            echo "✅ Found AppImage: $APPIMAGE_FILES"
          else
            echo "⚠️ No AppImage files found"
          fi
          
          # Look for any other distributable files
          echo ""
          echo "🔍 Other distribution files:"
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.jar" \) 2>/dev/null | head -10 || echo "No other distribution files found"

      - name: 📊 Analysis Summary
        run: |
          echo "📊 Build Analysis Summary:"
          echo ""
          echo "✅ Available packaging tasks: packageDmg, packageMsi"
          echo "❌ Missing Linux tasks: packageDeb, packageRpm, packageAppImage"
          echo ""
          echo "📋 Next steps needed:"
          echo "1. Check Compose Multiplatform documentation for Linux packaging"
          echo "2. Add Linux packaging configuration to build.gradle.kts"
          echo "3. May need additional Gradle plugins for DEB/RPM/AppImage"

      - name: 📋 Build Summary
        run: |
          echo "## 🐧 Linux Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Packages Created" >> $GITHUB_STEP_SUMMARY
          
          if [[ -n "${{ steps.find-packages.outputs.deb-path }}" ]]; then
            echo "- ✅ **DEB Package**: $(basename "${{ steps.find-packages.outputs.deb-path }}")" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **DEB Package**: Failed to create" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ -n "${{ steps.find-packages.outputs.rpm-path }}" ]]; then
            echo "- ✅ **RPM Package**: $(basename "${{ steps.find-packages.outputs.rpm-path }}")" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **RPM Package**: Failed to create" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ -n "${{ steps.find-packages.outputs.appimage-path }}" ]]; then
            echo "- ✅ **AppImage**: $(basename "${{ steps.find-packages.outputs.appimage-path }}")" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **AppImage**: Failed to create" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "If all packages built successfully, they can be integrated into release.yml" >> $GITHUB_STEP_SUMMARY