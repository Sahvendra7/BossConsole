name: 🎯 Simple Release Test

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  simple-macos-build:
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🎯 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔄 Increment Version
        run: |
          case "${{ github.event.inputs.version_increment }}" in
            "patch") ./gradlew incrementVersion ;;
            "minor") ./gradlew incrementMinor ;;
            "major") ./gradlew incrementMajor ;;
          esac
          VERSION=$(grep "^app.version=" version.properties | cut -d'=' -f2)
          echo "📦 Building version: $VERSION"

      - name: 🔐 Setup Code Signing & Build
        env:
          MACOS_P12_CERTIFICATE: ${{ secrets.MACOS_P12_CERTIFICATE }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          echo "🔐 Setting up certificate and building..."
          
          # Certificate setup
          if [[ -n "$MACOS_P12_CERTIFICATE" ]]; then
            echo "$MACOS_P12_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p temp_password temp_keychain
            security default-keychain -s temp_keychain
            security unlock-keychain -p temp_password temp_keychain
            security set-keychain-settings -lut 3600 temp_keychain
            security import certificate.p12 -k temp_keychain -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k temp_password temp_keychain
            security list-keychains -s temp_keychain
            rm certificate.p12
            
            echo "✅ Certificate imported"
            security find-identity -v -p codesigning temp_keychain
            
            export DISABLE_MACOS_SIGNING=false
          else
            echo "⚠️ No certificate - creating unsigned build"
            export DISABLE_MACOS_SIGNING=true
          fi
          
          # Build
          echo "🏗️ Building DMG..."
          chmod +x ./gradlew
          ./gradlew packageDmg
          
          # Verify
          if ls composeApp/build/compose/binaries/main/dmg/*.dmg 1> /dev/null 2>&1; then
            echo "✅ DMG created successfully!"
            ls -la composeApp/build/compose/binaries/main/dmg/
          else
            echo "❌ DMG creation failed"
            exit 1
          fi