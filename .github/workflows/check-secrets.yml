name: 🔍 Check DigiCert Secrets

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: windows-latest
    
    steps:
      - name: 🔍 Check DigiCert Secrets Configuration
        run: |
          Write-Host "=== DigiCert Secrets Check ===" -ForegroundColor Green
          
          $secrets_status = @()
          
          # Check each required secret
          $apiKey = "${{ secrets.DIGICERT_API_KEY }}"
          $clientKey = "${{ secrets.DIGICERT_CLIENT_AUTH_KEY }}"
          $certBase64 = "${{ secrets.DIGICERT_CLIENT_CERT_BASE64 }}"
          $thumbprint = "${{ secrets.DIGICERT_CERTIFICATE_THUMBPRINT }}"
          
          Write-Host "Required Secrets Status:" -ForegroundColor Yellow
          
          if ($apiKey) {
            Write-Host "✅ DIGICERT_API_KEY: Present ($($apiKey.Length) chars)" -ForegroundColor Green
            $secrets_status += "DIGICERT_API_KEY: ✅"
          } else {
            Write-Host "❌ DIGICERT_API_KEY: MISSING" -ForegroundColor Red
            $secrets_status += "DIGICERT_API_KEY: ❌"
          }
          
          if ($clientKey) {
            Write-Host "✅ DIGICERT_CLIENT_AUTH_KEY: Present ($($clientKey.Length) chars)" -ForegroundColor Green
            $secrets_status += "DIGICERT_CLIENT_AUTH_KEY: ✅"
          } else {
            Write-Host "❌ DIGICERT_CLIENT_AUTH_KEY: MISSING" -ForegroundColor Red
            $secrets_status += "DIGICERT_CLIENT_AUTH_KEY: ❌"
          }
          
          if ($certBase64) {
            Write-Host "✅ DIGICERT_CLIENT_CERT_BASE64: Present ($($certBase64.Length) chars)" -ForegroundColor Green
            $secrets_status += "DIGICERT_CLIENT_CERT_BASE64: ✅"
          } else {
            Write-Host "❌ DIGICERT_CLIENT_CERT_BASE64: MISSING" -ForegroundColor Red
            $secrets_status += "DIGICERT_CLIENT_CERT_BASE64: ❌"
          }
          
          if ($thumbprint) {
            Write-Host "✅ DIGICERT_CERTIFICATE_THUMBPRINT: Present ($thumbprint)" -ForegroundColor Green
            $secrets_status += "DIGICERT_CERTIFICATE_THUMBPRINT: ✅"
          } else {
            Write-Host "⚠️  DIGICERT_CERTIFICATE_THUMBPRINT: Not set (optional for fallback)" -ForegroundColor Yellow
            $secrets_status += "DIGICERT_CERTIFICATE_THUMBPRINT: ⚠️"
          }
          
          Write-Host ""
          Write-Host "=== Summary ===" -ForegroundColor Cyan
          foreach ($status in $secrets_status) {
            Write-Host "  $status"
          }
          
          # Check if minimum requirements are met
          $missing_required = @()
          if (-not $apiKey) { $missing_required += "DIGICERT_API_KEY" }
          if (-not $clientKey) { $missing_required += "DIGICERT_CLIENT_AUTH_KEY" }
          if (-not $certBase64) { $missing_required += "DIGICERT_CLIENT_CERT_BASE64" }
          
          if ($missing_required.Count -gt 0) {
            Write-Host ""
            Write-Host "❌ MISSING REQUIRED SECRETS:" -ForegroundColor Red
            foreach ($secret in $missing_required) {
              Write-Host "  - $secret" -ForegroundColor Red
            }
            Write-Host ""
            Write-Host "Add these secrets to repository settings:" -ForegroundColor Yellow
            Write-Host "https://github.com/risa-labs-inc/BOSS-Kotlin/settings/secrets/actions" -ForegroundColor Cyan
            exit 1
          } else {
            Write-Host ""
            Write-Host "✅ All required secrets are configured!" -ForegroundColor Green
            Write-Host "The signing should work. Check workflow logs for other issues." -ForegroundColor Green
          }
        shell: powershell