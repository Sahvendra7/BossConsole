name: Test Release Sync

# Manual trigger for testing
on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag to create (e.g., v8.8.1-test)'
        required: true
        default: 'v8.8.1-test'
      cleanup:
        description: 'Delete test release after sync'
        type: boolean
        default: true

jobs:
  test-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Create test release
      run: |
        TEST_TAG="${{ github.event.inputs.test_tag }}"
        
        # Create a small test file
        echo "Test release for sync validation" > test-file.txt
        echo "Created: $(date)" >> test-file.txt
        echo "Tag: ${TEST_TAG}" >> test-file.txt
        
        # Create test release
        gh release create "${TEST_TAG}" \
          --title "Test Release ${TEST_TAG}" \
          --notes "🧪 **Test Release**

This is a test release created to validate the automatic sync workflow.

**Test Details:**
- Created: $(date)
- Purpose: Workflow validation
- Auto-cleanup: ${{ github.event.inputs.cleanup }}

This release will be automatically synchronized to the public repository." \
          --prerelease \
          test-file.txt
        
        echo "✅ Test release ${TEST_TAG} created"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Wait for sync workflow
      run: |
        echo "⏳ Waiting 30 seconds for sync workflow to trigger..."
        sleep 30
        
        echo "📊 Checking workflow runs..."
        gh run list --workflow=sync-release.yml --limit 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify public release
      run: |
        TEST_TAG="${{ github.event.inputs.test_tag }}"
        
        echo "🔍 Checking if release exists in public repository..."
        
        # Wait a bit more for the sync to complete
        sleep 60
        
        # Check if release exists in public repo
        if gh release view "${TEST_TAG}" --repo risa-labs-inc/BOSS-Releases; then
          echo "✅ Release successfully synced to public repository"
        else
          echo "❌ Release not found in public repository"
          echo "ℹ️  This might be normal if the sync is still in progress"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    
    - name: Cleanup test release (optional)
      if: github.event.inputs.cleanup == 'true'
      run: |
        TEST_TAG="${{ github.event.inputs.test_tag }}"
        
        echo "🧹 Cleaning up test releases..."
        
        # Delete from private repo
        if gh release delete "${TEST_TAG}" --yes --cleanup-tag; then
          echo "✅ Deleted test release from private repository"
        else
          echo "⚠️  Could not delete from private repository (may not exist)"
        fi
        
        # Delete from public repo
        if GITHUB_TOKEN="${{ secrets.PUBLIC_REPO_TOKEN }}" gh release delete "${TEST_TAG}" --repo risa-labs-inc/BOSS-Releases --yes --cleanup-tag; then
          echo "✅ Deleted test release from public repository"
        else
          echo "⚠️  Could not delete from public repository (may not exist)"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Summary
      run: |
        echo "🎯 **Test Summary**"
        echo "- Test tag: ${{ github.event.inputs.test_tag }}"
        echo "- Cleanup enabled: ${{ github.event.inputs.cleanup }}"
        echo ""
        echo "📋 **Next Steps:**"
        echo "1. Check the 'Actions' tab for the sync-release workflow"
        echo "2. Verify the release appears in risa-labs-inc/BOSS-Releases"
        echo "3. Confirm README.md was updated with new version"
        echo ""
        echo "🔗 **Links:**"
        echo "- Public releases: https://github.com/risa-labs-inc/BOSS-Releases/releases"
        echo "- Workflow runs: https://github.com/${{ github.repository }}/actions"